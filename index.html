  const canResume = (S && !S.over) || (saved && saved.S && !saved.S.over);
  const resumeRound = S && !S.over ? S.round : saved && saved.S ? saved.S.round : 0;
  const lvlDesc = {easy:'Bots kopen vaak zomaar iets en maken fouten.', medium:'Bots spelen verstandig, met af en toe een misser.', hard:'Bots rekenen goed en wisselen op tijd van geld naar punten.'};
  const sample = [{u:'s1', id:'houthakker'}, {u:'s2', id:'winterpaleis'}, {u:'s3', id:'hofdame'}];
  app.innerHTML = `<div class="start">
    ${skylineSVG('skyline')}
    <div class="start-hero"><h1>Sint-Petersburg</h1><p>Bouw je stad met arbeiders, paleizen en hofadel. Wie aan het eind de meeste punten heeft, wint.</p></div>
    <div class="start-grid">
      <div><div class="fan">${sample.map(x => cardHTML(x)).join('')}</div>
        <p class="hint" style="text-align:center">Eerste editie (2004) · 2 tot 4 spelers · tegen de computer</p></div>
      <div class="panel form">
        <div><label for="f-name">Jouw naam</label><input type="text" id="f-name" maxlength="16" value="${esc(settings.name)}" autocomplete="off"></div>
        <div><span class="lbl">Aantal tegenstanders</span><div class="seg" role="group" aria-label="Aantal tegenstanders">
          ${[1,2,3].map(n => `<button data-act="set" data-k="bots" data-v="${n}" aria-pressed="${settings.bots === n}">${n}</button>`).join('')}</div></div>
        <div><span class="lbl">Niveau</span><div class="seg" role="group" aria-label="Niveau">
          ${['easy','medium','hard'].map(l => `<button data-act="set" data-k="level" data-v="${l}" aria-pressed="${settings.level === l}">${LEVEL_NL[l]}</button>`).join('')}</div>
          <p class="hint">${lvlDesc[settings.level]}</p></div>
        <div><span class="lbl">Tempo van de bots</span><div class="seg" role="group" aria-label="Tempo">
          ${[['slow','Rustig'],['normal','Normaal'],['fast','Snel']].map(([k, t]) => `<button data-act="set" data-k="speed" data-v="${k}" aria-pressed="${settings.speed === k}">${t}</button>`).join('')}</div></div>
        <label class="check"><input type="checkbox" id="f-big" ${settings.big ? 'checked' : ''}> Grote tekst en kaarten</label>
        <label class="check"><input type="checkbox" id="f-sound" ${settings.sound ? 'checked' : ''}> Geluid</label>
        <div class="start-actions">
          <button class="btn primary" data-act="new">Nieuw spel</button>
          ${canResume ? `<button class="btn" data-act="resume">Verder spelen (ronde ${resumeRound})</button>` : ''}
          <button class="btn" data-act="rules">Spelregels</button>
        </div>
        ${ui.confirmNew ? `<div class="note"><p style="margin:0 0 8px">Er loopt nog een spel. Wil je dat stoppen en opnieuw beginnen?</p><div class="btns"><button class="btn primary small" data-act="new-yes">Ja, nieuw spel</button><button class="btn small" data-act="new-no">Nee</button></div></div>` : ''}
      </div>
    </div></div>`;
}

function tableauHTML(p){
  const groups = {worker:{}, building:{}, aristocrat:{}};
  p.cards.forEach(x => { const c = C(x); (groups[c.type][x.id] = groups[c.type][x.id] || []).push(x); });
  return `<div class="tableau">${['worker','building','aristocrat'].map(type => {
    const ids = Object.keys(groups[type]).sort((a, b) => CAT[a].cost - CAT[b].cost);
    const g = phaseGain(p, type);
    const extra = type === 'aristocrat' && ids.length ? ` · ${aristoKinds(p.cards)} soorten` : '';
    return `<div class="tgroup ${type}"><h4>${DECK_NL[type]}<span>${g.r || g.v ? fmtGain(g.r, g.v) + ' per ronde' : ''}${extra}</span></h4>
      ${ids.length ? `<div class="minis">${ids.map(id => { const list = groups[type][id], isNew = S.flash && list.some(x => x.u === S.flash.u);
        return `<div class="mini-wrap${isNew ? ' new' : ''}">${cardHTML(list[0], {mini:true, act:'view'})}${list.length > 1 ? `<i>×${list.length}</i>` : ''}</div>`; }).join('')}</div>` : `<span class="none">Nog geen ${DECK_NL[type].toLowerCase()}.</span>`}
    </div>`; }).join('')}</div>`;
}
function markersOf(pi){ if(S.drawSeq && !S.drawDone) return ['nog niet getrokken']; return S.markers.map((m, i) => m === pi ? PH[i].name : null).filter(Boolean); }

function trackHTML(){
  const segs = Array.from({length:20}, () => '<span></span>').join('');
  const labels = [0,20,40,60,80,100].map(v => `<em style="left:${v}%">${v}</em>`).join('');
  const seen = {};
  const pawns = S.players.map((p, i) => {
    const pos = p.vp % 100;
    const lift = (seen[pos] = (seen[pos] || 0) + 1) - 1;
    return `<span class="track-pawn" style="left:${pos}%;margin-bottom:${lift * 9}px" title="${esc(p.name)}: ${p.vp} punten">${p.vp >= 100 ? '<sup>+100</sup>' : ''}${pawnSVG(i, 14)}</span>`;
  }).join('');
  return `<div class="track" role="img" aria-label="Scorebaan: ${esc(S.players.map(p => `${p.name} ${p.vp} punten`).join(', '))}"><div class="track-bar">${segs}${labels}${pawns}</div></div>`;
}
function bonusHTML(){
  const kinds = aristoKinds(S.players[0].cards), k = Math.min(10, kinds);
  return `<div class="bonus"><div class="bonus-wrap"><table aria-label="Eindbonus voor verschillende aristocraten"><tr>${ARI.slice(1).map((_, i) => `<td class="${k === i + 1 ? 'me' : ''}">${i + 1}${i === 9 ? '+' : ''}</td>`).join('')}</tr><tr>${ARI.slice(1).map((v, i) => `<td class="${k === i + 1 ? 'me' : ''}">${v}</td>`).join('')}</tr></table></div>
    <p>Eindbonus voor verschillende soorten aristocraten. Jij hebt er nu ${kinds}.</p></div>`;
}

function renderGame(){
  const me = S.players[0], mine = isMyTurn(), cur = S.players[S.cur];
  const slotRow = src => {
    const arr = rowArr(src); let h = '';
    for(let i = 0; i < ROW; i++){
      const inst = arr[i];
      if(!inst){ h += `<div class="slot" aria-hidden="true"></div>`; continue; }
      const sp = shownPrice(inst, src);
      h += cardHTML(inst, {act:'card', src, i, price:sp.price, na:sp.na, dim:mine && !sp.ok && me.hand.length >= handLimit(me)});
    }
    return h;
  };
  let handSlots = '';
  for(let i = 0; i < handLimit(me); i++){
    const inst = me.hand[i];
    if(!inst){ handSlots += `<div class="slot" aria-hidden="true"></div>`; continue; }
    const sp = shownPrice(inst, 'hand');
    handSlots += cardHTML(inst, {act:'card', src:'hand', i, price:sp.price, na:sp.na, dim:mine && !sp.ok});
  }
  const rivals = S.players.map((p, i) => {
    if(i === 0) return '';
    const turn = S.cur === i && !S.over && !S.pending;
    return `<button class="rival${turn ? ' turn' : ''}" data-act="rival" data-pi="${i}" aria-label="${esc(p.name)}: ${p.money} roebel, ${p.vp} punten. Bekijk kaarten">
      <div class="rival-h">${pawnSVG(i, 16)}<b>${esc(p.name)}</b><small>${LEVEL_NL[p.bot]}</small>${turn ? '<span class="thinking">denkt na…</span>' : ''}</div>
      ${p.lastMove ? `<span class="lastmove${p.lastMove === 'past' ? ' pass' : ''}">${esc(p.lastMove)}</span>` : ''}
      <div class="rival-s"><span class="minibill num"><i></i>${p.money} ₽</span><span class="num"><b>${p.vp}</b> ★</span><span class="num">hand ${p.hand.length}</span>
        <span class="counts"><span style="background:var(--worker)">${countType(p, 'worker')}</span><span style="background:var(--building)">${countType(p, 'building')}</span><span style="background:var(--aristocrat)">${countType(p, 'aristocrat')}</span></span></div>
    </button>`;
  }).join('');
  const decks = PH.map((ph, i) => {
    const isCur = i === S.phase && !S.over, st = S.markers[i];
    return `<div class="deck d-${ph.deck}${isCur ? ' cur' : ''}"><div class="back ${ph.deck}">${BACK_ICON[ph.deck]}<span class="cnt num">${S.decks[ph.deck].length}</span></div>
      <b>${ph.name}</b>${isCur ? '<span class="now">nu</span>' : ''}<span class="starter">${S.drawSeq && !S.drawDone ? '?' : pawnSVG(st, 11) + esc(S.players[st].name)}</span></div>`;
  }).join('');
  let now, sub = S.lastAct || '';
  if(S.over) now = 'Het spel is afgelopen.';
  else if(S.pending && S.pending.t === 'pub') now = 'Kroeg: kies hoeveel punten je koopt.';
  else if(S.pending && S.pending.t === 'obs') now = 'Sterrenwacht: kies wat je met de kaart doet.';
  else if(mine) now = 'Jouw beurt: tik op een kaart, of pas.';
  else now = `${cur.name} is aan de beurt…`;
  if(mine && S.passes) sub = `${S.passes} speler${S.passes > 1 ? 's hebben' : ' heeft'} gepast. ${sub}`;
  app.innerHTML = `<div class="game">
    <header class="top"><span class="brand">Sint-Petersburg</span><span class="rnd num">Ronde ${S.round}${S.lastRound ? ' <span class="last">· laatste ronde</span>' : ''}</span>${S.over ? '' : `<span class="phasepill ${PH[S.phase].key}">Fase ${S.phase + 1} van 4: ${PH[S.phase].name}</span>`}
      <button class="btn small" data-act="menu">Menu</button></header>
    <section class="rivals" aria-label="Tegenstanders">${rivals}</section>
    <section class="board" aria-label="Speelbord">
      ${skylineSVG('wm')}
      ${S.lastRound && !S.over ? '<div class="lastribbon">Laatste ronde · na de ruilkaartenfase is het spel voorbij</div>' : ''}
      ${trackHTML()}
      <div class="decks${S.over ? '' : ' live'}">${decks}</div>
      <div class="rowlbl">Bovenste rij <span>volle prijs</span></div>
      <div class="slots">${slotRow('upper')}</div>
      <div class="rowlbl">Onderste rij <span class="plaque">−1 ₽</span><span>verdwijnt aan het eind van de ronde</span></div>
      <div class="slots">${slotRow('lower')}</div>
      ${bonusHTML()}
    </section>
    <section class="mytable${mine ? ' turn' : ''}" aria-label="Jouw tafel">
      <div class="mt-head">${pawnSVG(0, 20)}<h2>${esc(me.name)}</h2><span class="vpbadge num">${me.vp} ★</span><span class="muted" style="font-size:.88em">Begint bij: ${markersOf(0).join(', ') || '—'}</span></div>
      <div class="mt-top">
        <div class="zone"><h3>Geld</h3>${moneyHTML(me.money, true)}</div>
        <div class="zone"><h3>Hand <small>gratis bewaren · aan het eind −5 punten per kaart</small></h3><div class="handslots">${handSlots}</div></div>
      </div>
      <div class="zone"><h3>Jouw stad</h3>${tableauHTML(me)}</div>
    </section>
  </div>
  <div class="actionbar"><div class="ab-in">
    <div class="ab-msg">${S.over ? '' : `<span class="phasepill ${PH[S.phase].key}">${PH[S.phase].name}</span>` + pawnSVG(S.cur, 18)}<div role="status" aria-live="polite"><b>${esc(now)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</div></div>
    <div class="ab-btns">
      ${S.over ? `<button class="btn primary" data-act="show-final">Uitslag</button><button class="btn" data-act="again">Nieuw spel</button>` : `
      ${canObs(me) ? `<button class="btn" data-act="obs-open" ${mine ? '' : 'disabled'}>Sterrenwacht</button>` : ''}
      <button class="btn" data-act="undo" ${undoSnap ? '' : 'disabled'}>Terug</button>
      <button class="btn" data-act="tip" ${mine ? '' : 'disabled'}>Tip</button>
      <button class="btn primary" data-act="pass" ${mine ? '' : 'disabled'}>Passen</button>`}
    </div></div></div>`;
}

function render(){
  document.documentElement.classList.toggle('groot', !!settings.big);
  if(ui.view === 'start' || !S) renderStart(); else renderGame();
  renderModal();
  if(S && ui.view === 'game'){
    if(S.scoreId !== ui.shownScore && S.lastScore){ ui.shownScore = S.scoreId; ui.queue.push({k:'score'});
      const me = S.lastScore.parts.find(x => x.i === 0); if(me && me.r) playSound('money'); if(me && me.v) playSound('points', me.r ? 450 : 0); }
    if(S.drawSeq && !S.drawDone && !ui.queue.some(q => q.k === 'draw')) ui.queue.unshift({k:'draw'});
    if((S.rotateId || 0) !== ui.shownRotate){ ui.shownRotate = S.rotateId || 0; if(S.prevMarkers) ui.queue.push({k:'rotate'}); }
    if((S.announceId || 0) !== ui.shownAnnounce){ ui.shownAnnounce = S.announceId; ui.queue.push({k:'last'}); playSound('last', 600); }
    if(S.bannerId !== ui.shownBanner && !ui.queue.length){
      ui.shownBanner = S.bannerId; playSound('phase');
      bannerEl.innerHTML = `<div class="banner"><div><small>Ronde ${S.round}${S.lastRound ? ' · laatste ronde' : ''}</small><strong>${PH[S.phase].name}</strong></div></div>`;
      clearTimeout(bannerTimer); bannerTimer = setTimeout(() => bannerEl.innerHTML = '', 2000);
    }
    if((S.moveId || 0) !== ui.shownMove){
      ui.shownMove = S.moveId || 0;
      const m = S.move;
      if(m && /^(kocht|speelde)/.test(m.short)) playSound('buy', 0, m.pi === 0 ? 1 : 0.6);
      if(m && m.pi !== 0 && m.short === 'past') playSound('pass', 0, 0.8);
      if(m && m.pi !== 0){
        const dur = m.id ? Math.max(1600, Math.min(3200, delay() * 1.8)) : Math.max(1200, Math.min(2200, delay() * 1.4));
        toastEl.innerHTML = `<div class="movetoast${m.id ? '' : ' pass'}" style="--d:${dur}ms">${m.id ? `<div class="mini-wrap">${cardHTML({u:'t', id:m.id}, {mini:true})}</div>` : ''}<div><b>${pawnSVG(m.pi, 14)} ${esc(S.players[m.pi].name)}</b><span>${esc(m.short)}</span></div></div>`;
        clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.innerHTML = '', dur);
      }
    }
    renderModal();
    const myTurnNow = isMyTurn() && !ui.queue.length;
    if(myTurnNow && !ui.wasMyTurn) playSound('turn', 250);
    ui.wasMyTurn = myTurnNow;
    if(S.over && !ui.endSound){ ui.endSound = true; if(S.final && S.final[0].i === 0) playSound('win', 300); }
  }
}

/* ---------- modals ---------- */
function priceCalc(p, c, src, rep){
  const parts = priceParts(p, c, src, rep), pr = price(p, c, src, rep);
  return `${c.cost} ₽ ${parts.map(x => `− ${x[0]} (${esc(x[1])})`).join(' ')} = <b>${pr} ₽</b>${c.cost - parts.reduce((s, x) => s + x[0], 0) < 1 ? ' (minimaal 1 ₽)' : ''}`;
}
function scoringTxt(c){
  const when = {worker:'na de arbeidersfase', building:'na de gebouwenfase', aristocrat:'na de aristocratenfase'}[c.type];
  if(c.per) return `Levert elke ronde 1 roebel op per ${TYPE_PL[c.per]} die je hebt, ${when}.`;
  const g = []; if(c.r) g.push(`${c.r} roebel${c.r > 1 ? 's' : ''}`); if(c.vp) g.push(`${c.vp} punt${c.vp > 1 ? 'en' : ''}`);
  return g.length ? `Levert elke ronde ${g.join(' en ')} op, ${when}.` : 'Levert zelf geen roebels of punten op.';
}
function replaceNeedTxt(c){
  if(c.type === 'worker'){ const base = Object.values(CAT).find(x => !x.trade && x.sub === c.sub); return `een ${base.name} of Tsaar Peter`; }
  return c.type === 'building' ? 'een gewoon gebouw' : 'een gewone aristocraat';
}
function cardInfo(inst){
  const c = C(inst);
  return `<div class="sheet-top">${cardHTML(inst)}<div style="display:grid;gap:8px;min-width:0">
    <h2>${esc(c.name)}</h2>
    <p class="muted">${c.trade ? 'Ruilkaart · ' : ''}${TYPE_NL[c.type]} · kost ${c.cost} ₽</p>
    <p>${scoringTxt(c)}</p>
    ${c.trade ? `<p>Vervangt ${replaceNeedTxt(c)} die je al hebt. Je betaalt het verschil; de oude kaart gaat weg.</p>` : ''}
    ${c.desc ? `<p>${esc(c.desc)}</p>` : ''}
    ${c.type === 'aristocrat' ? `<p class="muted">Elke andere soort aristocraat verhoogt je eindbonus.</p>` : ''}
  </div></div>`;
}
function cardSheet(m){
  const p = S.players[0];
  let inst, src = m.src;
  if(src === 'upper' || src === 'lower') inst = rowArr(src)[m.i];
  else if(src === 'hand') inst = p.hand[m.i];
  else inst = {u:'v', id:m.id};
  if(!inst){ ui.modal = null; return ''; }
  const c = C(inst), info = cardInfo(inst);
  if(src !== 'upper' && src !== 'lower' && src !== 'hand') return info + `<div class="btns"><button class="btn" data-act="close">Sluiten</button></div>`;
  let body = '';
  if(!isMyTurn()){
    body = `<p class="muted">Je kunt deze kaart kopen zodra je aan de beurt bent.</p>`;
  } else {
    const opts = buyOptions(p, inst, src), btns = [];
    if(c.trade && !opts.length) body += `<p class="reason">Je hebt nog geen ${replaceNeedTxt(c)} om te vervangen.</p>`;
    opts.forEach(o => {
      const rep = o.rep ? p.cards.find(x => x.u === o.rep) : null, ok = o.price <= p.money;
      const label = rep ? `Vervang ${esc(C(rep).name)} · ${o.price} ₽` : `${src === 'hand' ? 'Spelen' : 'Kopen'} voor ${o.price} ₽`;
      btns.push(`<div style="display:grid;gap:4px"><button class="btn primary" data-act="buy" data-src="${src}" data-i="${m.i}" data-rep="${o.rep || ''}" ${ok ? '' : 'disabled'}>${label}</button>
        ${o.price !== c.cost ? `<span class="calc">${priceCalc(p, c, src, rep)}</span>` : ''}${ok ? '' : `<span class="reason">Te weinig roebels: je hebt ${p.money} ₽.</span>`}</div>`);
    });
    if(src !== 'hand'){
      const full = p.hand.length >= handLimit(p);
      btns.push(`<div style="display:grid;gap:4px"><button class="btn" data-act="take" data-src="${src}" data-i="${m.i}" ${full ? 'disabled' : ''}>In je hand nemen (gratis)</button>
        ${full ? `<span class="reason">Je hand is vol (${p.hand.length} van ${handLimit(p)}).</span>` : ''}</div>`);
    }
    body += `<div class="btns col">${btns.join('')}</div>`;
  }
  return info + body + `<div class="btns"><button class="btn" data-act="close">Sluiten</button></div>`;
}
function rivalSheet(pi){
  const p = S.players[pi];
  return `<div style="display:flex;align-items:center;gap:10px">${pawnSVG(pi, 22)}<h2>${esc(p.name)}</h2><span class="muted">${LEVEL_NL[p.bot]}</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center">${moneyHTML(p.money, false)}<span class="vpbadge num">${p.vp} ★</span><span class="muted">${p.hand.length} kaart${p.hand.length === 1 ? '' : 'en'} in de hand · begint bij: ${markersOf(pi).join(', ') || '—'}</span></div>
    ${tableauHTML(p)}
    <div class="btns"><button class="btn primary" data-act="close">Sluiten</button></div>`;
}
function rulesSheet(){
  return `<h2>Spelregels</h2><div class="rules">
  <p>Je speelt de eerste editie (2004). Je begint met ${START_MONEY} roebels (₽). Wie aan het eind de meeste punten (★) heeft, wint.</p>
  <h3>Een ronde: vier fasen</h3>
  <ul><li><b>Arbeiders</b> (groen): leveren roebels op.</li><li><b>Gebouwen</b> (blauw): leveren vooral punten op.</li><li><b>Aristocraten</b> (oranje): leveren roebels en punten op, en een grote bonus aan het eind.</li><li><b>Ruilkaarten</b>: betere versies van kaarten die je al hebt.</li></ul>
  <p>Aan het begin van elke fase komen er kaarten van die stapel in de bovenste rij, tot er in beide rijen samen ${ROW} kaarten liggen.</p>
  <h3>Je beurt</h3>
  <ul><li><b>Kopen</b>: betaal de prijs en leg de kaart bij je stad.</li><li><b>In je hand nemen</b>: gratis bewaren (maximaal 3) en later betalen.</li><li><b>Uit je hand spelen</b>: betaal de prijs.</li><li><b>Passen</b>: je mag later in dezelfde fase weer meedoen. De fase eindigt pas als iedereen na elkaar heeft gepast.</li></ul>
  <h3>Telling</h3>
  <p>Na de arbeidersfase krijgt iedereen de roebels en punten van zijn groene kaarten. Na de gebouwenfase die van zijn blauwe kaarten, en na de aristocratenfase die van zijn oranje kaarten. De ruilkaartenfase heeft geen telling. Ruilkaarten tellen mee met hun eigen kleur.</p>
  <h3>Korting</h3>
  <ul><li>1 ₽ korting voor elke gelijke kaart die je al hebt.</li><li>1 ₽ korting in de onderste rij.</li><li>Timmerwerkplaats: 1 ₽ korting op gebouwen. Goudsmelterij: 1 ₽ korting op aristocraten.</li><li>Een ruilkaart vervangt een gewone kaart (geen andere ruilkaart) van dezelfde kleur. Je betaalt de prijs min de waarde van de oude kaart. Groene ruilkaarten passen alleen op de juiste soort arbeider (of op Tsaar Peter).</li><li>Je betaalt altijd minstens 1 ₽.</li></ul>
  <h3>Einde van de ronde</h3>
  <p>De onderste rij gaat weg, de bovenste rij schuift naar beneden en de startspelers schuiven één plaats door.</p>
  <h3>Einde van het spel</h3>
  <p>Raakt een stapel op, dan wordt de ronde nog afgemaakt. Daarna:</p>
  <ul><li>Bonus voor verschillende soorten aristocraten: 1, 3, 6, 10, 15, 21, 28, 36, 45, 55 punten.</li><li>1 punt per 10 ₽.</li><li>−5 punten voor elke kaart in je hand.</li><li>Bij gelijkspel wint wie de meeste roebels heeft.</li></ul>
  </div><div class="btns"><button class="btn primary" data-act="close">Sluiten</button></div>`;
}
function cardsSheet(){
  const groups = [['worker','Arbeiders'],['building','Gebouwen'],['aristocrat','Aristocraten'],['trade','Ruilkaarten']];
  const yieldCell = c => [c.per ? `1 ₽ per ${TYPE_PL[c.per]}` : (c.r ? c.r + ' ₽' : ''), c.vp ? c.vp + ' ★' : ''].filter(Boolean).join(' + ') || '–';
  const rows = deck => Object.values(CAT).filter(c => c.deck === deck).map(c => `<tr><td><span class="dot ${c.type}" style="margin-right:6px"></span>${esc(c.name)}</td><td class="n">${c.n}</td><td class="n">${c.cost} ₽</td><td class="n">${yieldCell(c)}</td><td style="white-space:normal;min-width:160px">${c.trade ? 'Vervangt ' + replaceNeedTxt(c) + '. ' : ''}${esc(c.desc)}</td></tr>`).join('');
  return `<h2>Kaartenlijst</h2>` +
    groups.map(([deck, title]) => `<h3 style="font-size:1.1em;color:var(--emerald)">${title} · ${Object.values(CAT).filter(c => c.deck === deck).reduce((s, c) => s + c.n, 0)} kaarten</h3>
    <div class="tbl-wrap"><table class="t"><thead><tr><th>Kaart</th><th class="n">Aantal</th><th class="n">Kosten</th><th class="n">Opbrengst</th><th>Bijzonder</th></tr></thead><tbody>${rows(deck)}</tbody></table></div>`).join('') +
    `<p class="note">Waarden volgen het kaartoverzicht van de eerste editie. Het aantal exemplaren per kaart staat daar niet op; die aantallen zijn geschat.</p><div class="btns"><button class="btn primary" data-act="close">Sluiten</button></div>`;
}
function logSheet(){
  return `<h2>Verloop</h2><ol class="loglist">${S.log.slice().reverse().map(l => `<li class="${l.cls}">${esc(l.txt)}</li>`).join('')}</ol><div class="btns"><button class="btn primary" data-act="close">Sluiten</button></div>`;
}
function menuSheet(){
  return `<h2>Menu</h2>
  <div class="btns"><button class="btn" data-act="rules">Spelregels</button><button class="btn" data-act="cards">Kaartenlijst</button><button class="btn" data-act="log">Verloop van het spel</button></div>
  <div><span style="font-weight:700;display:block;margin-bottom:6px">Tempo van de bots</span><div class="seg">${[['slow','Rustig'],['normal','Normaal'],['fast','Snel']].map(([k, t]) => `<button data-act="set" data-k="speed" data-v="${k}" aria-pressed="${settings.speed === k}">${t}</button>`).join('')}</div></div>
  <label class="check"><input type="checkbox" id="m-big" ${settings.big ? 'checked' : ''}> Grote tekst en kaarten</label>
  <label class="check"><input type="checkbox" id="m-sound" ${settings.sound ? 'checked' : ''}> Geluid <span class="muted" style="font-weight:400;font-size:.9em">(hoor je niets? zet de stille modus uit)</span></label>
  <div class="btns col"><button class="btn primary" data-act="close">Terug naar het spel</button><button class="btn" data-act="home">Naar het beginscherm</button></div>
  <p class="muted" style="font-size:.9em">Het spel wordt automatisch bewaard in deze browser. Je kunt later verder spelen. · Versie ${APP_VERSION}</p>`;
}
function pubSheet(){
  const {max} = S.pending, k = ui.pubK == null ? max : Math.min(ui.pubK, max), p = S.players[0];
  return `<h2>Kroeg</h2><p>Je mag 2 ₽ betalen voor elk punt, tot ${max} punt${max > 1 ? 'en' : ''}. Je hebt ${p.money} ₽.</p>
  <div class="stepper"><button class="btn" data-act="pub-dec" aria-label="Minder">−</button><output class="num">${k}</output><button class="btn" data-act="pub-inc" aria-label="Meer">+</button><span class="muted">punt${k === 1 ? '' : 'en'} voor ${2 * k} ₽</span></div>
  <div class="btns"><button class="btn primary" data-act="pub-ok" data-k="${k}">Bevestigen</button><button class="btn" data-act="pub-zero">Niets kopen</button></div>`;
}
function obsChooseSheet(){
  return `<h2>Sterrenwacht</h2><p>Kies van welke stapel je de bovenste kaart trekt. Daarna mag je hem kopen, in je hand nemen of wegleggen. De laatste kaart van een stapel mag je niet trekken.</p>
  <div class="btns col">${Object.keys(S.decks).map(d => `<button class="btn" data-act="obs" data-deck="${d}" ${S.decks[d].length > 1 ? '' : 'disabled'}><span class="dot ${d}"></span>${DECK_NL[d]} (${S.decks[d].length} kaarten)</button>`).join('')}</div>
  <div class="btns"><button class="btn" data-act="close">Annuleren</button></div>`;
}
function obsResultSheet(){
  const p = S.players[0], inst = S.pending.inst, c = C(inst), opts = buyOptions(p, inst, 'hand');
  const full = p.hand.length >= handLimit(p);
  return `<h2>Sterrenwacht</h2>${cardInfo(inst)}
  <div class="btns col">${opts.map(o => { const rep = o.rep ? p.cards.find(x => x.u === o.rep) : null, ok = o.price <= p.money;
    return `<button class="btn primary" data-act="obs-buy" data-rep="${o.rep || ''}" ${ok ? '' : 'disabled'}>${rep ? `Vervang ${esc(C(rep).name)} · ` : 'Kopen voor '}${o.price} ₽</button>`; }).join('')}
    ${c.trade && !opts.length ? `<p class="reason">Je hebt nog geen ${replaceNeedTxt(c)} om te vervangen.</p>` : ''}
    <button class="btn" data-act="obs-hand" ${full ? 'disabled' : ''}>In je hand nemen</button>
    <button class="btn" data-act="obs-discard">Wegleggen</button></div>`;
}
function scoreSheet(){
  const ls = S.lastScore, ph = PH[ls.phase];
  const rows = ls.parts.map(x => { const p = S.players[x.i];
    return `<div class="ovs-row${x.i === 0 ? ' me' : ''}">${pawnSVG(x.i, 18)}<span class="who">${esc(x.name)}</span>
      <span class="gain">${x.r ? `<span><i class="gainbill"></i>+${x.r} ₽</span>` : ''}${x.v ? `<span>+${x.v} ★</span>` : ''}${!x.r && !x.v ? '<span class="zero">niets</span>' : ''}</span>
      <span class="after">Nu ${p.money} ₽ en ${p.vp} punten</span></div>`; }).join('');
  const pub = (ls.pub || []).map(x => `${esc(x.name)} kocht in de Kroeg ${x.k} punt${x.k > 1 ? 'en' : ''}.`).join(' ');
  return `<div style="display:flex;align-items:center;gap:10px"><span class="dot ${ph.key}" style="width:14px;height:14px"></span><h2>Telling ${ph.name.toLowerCase()}</h2></div>
    <p class="muted">${ls.phase === 0 ? 'Iedereen krijgt de roebels van zijn arbeiders.' : ls.phase === 1 ? 'Iedereen krijgt de punten (en roebels) van zijn gebouwen.' : 'Iedereen krijgt de roebels en punten van zijn aristocraten.'}</p>
    <div class="ovs">${rows}</div>${pub ? `<p class="muted">${pub}</p>` : ''}
    <div class="autoclose" style="--d:6500ms"></div>
    <div class="btns"><button class="btn primary" data-act="ov-ok">Verder</button></div>`;
}
function lastSheet(){
  return `<div class="ov-last"><span class="big">Laatste ronde!</span>
    <p>De stapel <b>${esc(S.announceDeck || '')}</b> is op. Na de ruilkaartenfase van deze ronde is het spel afgelopen.</p>
    <ul><li>Geef je roebels uit: aan het eind is 10 ₽ maar 1 punt waard.</li><li>Speel de kaarten uit je hand: elke kaart die overblijft kost 5 punten.</li><li>Nieuwe soorten aristocraten verhogen je eindbonus.</li></ul>
    <button class="btn primary" data-act="ov-ok">Begrepen</button></div>`;
}
function startCard(phase, owner, fresh){
  const ph = PH[phase];
  return `<div class="sc"><div class="sc-card up ${ph.deck}${fresh ? ' flip' : ''}">${BACK_ICON[ph.deck]}<b>${ph.name}</b></div>${owner != null ? `<span class="sc-who">${pawnSVG(owner, 12)}${esc(S.players[owner].name)}</span>` : ''}</div>`;
}
function drawPick(pos, pi){
  const d = ui.draw, seq = S.drawSeq;
  if(!d || d.step >= seq.length || seq[d.step].pi !== pi || d.picks[pos]) return;
  d.picks[pos] = {phase:seq[d.step].phase, pi, fresh:true};
  d.step++; d.timer = null;
  renderModal();
}
function drawSheet(){
  const d = ui.draw || (ui.draw = {step:0, picks:{}, timer:null});
  const seq = S.drawSeq, done = d.step >= seq.length, drawer = done ? null : seq[d.step].pi;
  const n = S.players.length;
  const cards = [0,1,2,3].map(pos => {
    const p = d.picks[pos];
    if(p){ const h = startCard(p.phase, p.pi, p.fresh); p.fresh = false; return h; }
    return `<div class="sc"><button class="sc-card down" data-act="draw-pick" data-pos="${pos}" ${drawer === 0 ? '' : 'disabled'} aria-label="Startkaart ${pos + 1} trekken"><svg viewBox="0 0 40 32" aria-hidden="true"><path d="M20 2 C14 8 14 12 20 14 C26 12 26 8 20 2Z" fill="#d9b55c"/><rect x="16" y="14" width="8" height="6" fill="#f7eed7"/><rect x="6" y="20" width="28" height="10" fill="#f7eed7"/></svg></button><span class="sc-who">&nbsp;</span></div>`;
  }).join('');
  if(!done && drawer !== 0 && !d.timer){
    d.timer = setTimeout(() => {
      if(ui.draw !== d) return;
      const free = [0,1,2,3].filter(pos => !d.picks[pos]);
      drawPick(free[Math.floor(Math.random() * free.length)], drawer);
    }, 1100);
  }
  const msg = done ? 'Iedereen heeft getrokken.' : drawer === 0 ? 'Jij bent aan de beurt: tik op een kaart.' : `${esc(S.players[drawer].name)} trekt een kaart…`;
  const summary = done ? `<div class="sc-sum">${S.players.map((p, i) => { const mine = S.markers.map((m, ph) => m === i ? PH[ph].name : null).filter(Boolean);
      return `<div class="sc-row${i === 0 ? ' me' : ''}">${pawnSVG(i, 16)}<b>${esc(p.name)}</b><span>begint bij ${mine.length ? mine.join(' en ') : 'geen fase'}</span></div>`; }).join('')}</div>` : '';
  return `<h2>Wie begint welke fase?</h2>
    <p class="muted">Om de beurt trekt iedereen een startkaart. Wie de kaart van een fase heeft, mag in die fase als eerste kiezen.${n < 4 ? ' Met minder dan vier spelers trekt iemand er twee.' : ''}</p>
    <p class="sc-msg">${done ? '' : pawnSVG(drawer, 16)} ${msg}</p>
    <div class="sc-grid">${cards}</div>${summary}
    ${done ? '<div class="btns"><button class="btn primary" data-act="ov-ok">Spel beginnen</button></div>' : ''}`;
}
function rotateSheet(){
  const prev = S.prevMarkers || S.markers;
  const mine = S.markers.map((m, ph) => m === 0 ? PH[ph].name : null).filter(Boolean);
  const rows = PH.map((ph, i) => `<div class="rot-row" style="animation-delay:${i * 180}ms">
      <span class="phasepill ${ph.key}">${ph.name}</span>
      <span class="rot-old">${pawnSVG(prev[i], 12)}${esc(S.players[prev[i]].name)}</span>
      <span class="rot-arrow" aria-hidden="true">→</span>
      <span class="rot-new${S.markers[i] === 0 ? ' me' : ''}">${pawnSVG(S.markers[i], 14)}${esc(S.players[S.markers[i]].name)}</span></div>`).join('');
  return `<h2>Ronde ${S.round}: startkaarten schuiven door</h2>
    <p class="muted">Elke startkaart gaat één speler verder.</p>
    <div class="rot">${rows}</div>
    <p class="rot-me">${mine.length ? `Jij begint deze ronde bij <b>${mine.join(' en ')}</b>.` : 'Jij begint deze ronde bij geen enkele fase.'}</p>
    <div class="btns"><button class="btn primary" data-act="ov-ok">Verder</button></div>`;
}
function dismissQueue(){ clearTimeout(queueTimer); ui.queue.shift(); renderModal(); tick(); }
function finalSheet(){
  const f = S.final, win = f[0], iWon = win.i === 0;
  return `<h2>${iWon ? 'Gefeliciteerd, je hebt gewonnen!' : `${esc(win.name)} wint`}</h2>
  <p class="muted">${iWon ? 'Sint-Petersburg is trots op zijn nieuwe bouwmeester.' : 'Volgende keer beter. Probeer het nog eens!'}</p>
  <div class="tbl-wrap"><table class="t"><thead><tr><th>Speler</th><th class="n">Totaal</th><th class="n">Tijdens spel</th><th class="n">Aristocraten</th><th class="n">Roebels</th><th class="n">Hand</th></tr></thead><tbody>
  ${f.map((r, i) => `<tr class="${i === 0 ? 'win' : ''}"><td>${pawnSVG(r.i, 12)} ${esc(r.name)}</td><td class="n"><b>${r.total}</b></td><td class="n">${r.vp}</td><td class="n">+${r.bonus} <span class="muted">(${r.kinds} soorten)</span></td><td class="n">+${r.geld} <span class="muted">(${r.money} ₽)</span></td><td class="n">${r.hand}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="btns"><button class="btn primary" data-act="again">Nog een keer</button><button class="btn" data-act="hide-final">Bord bekijken</button><button class="btn" data-act="home">Beginscherm</button></div>`;
}
function renderModal(){
  let html = '', wide = false;
  if(S && ui.view === 'game' && ui.queue.length){
    const q = ui.queue[0];
    html = q.k === 'score' ? scoreSheet() : q.k === 'draw' ? drawSheet() : q.k === 'rotate' ? rotateSheet() : lastSheet();
    if(q.k === 'score' && !q.timer){ q.timer = true; clearTimeout(queueTimer); queueTimer = setTimeout(() => { if(ui.queue[0] === q) dismissQueue(); }, 6500); }
  }
  else if(S && ui.view === 'game'){
    if(S.over && !ui.hideFinal){ html = finalSheet(); wide = true; }
    else if(S.pending && S.pending.pi === 0 && S.pending.t === 'pub') html = pubSheet();
    else if(S.pending && S.pending.pi === 0 && S.pending.t === 'obs') html = obsResultSheet();
  }
  if(!html && ui.modal){
    const m = ui.modal;
    if(m.k === 'card') html = cardSheet(m);
    else if(m.k === 'rival'){ html = rivalSheet(m.pi); wide = true; }
    else if(m.k === 'rules') html = rulesSheet();
    else if(m.k === 'cards'){ html = cardsSheet(); wide = true; }
    else if(m.k === 'log') html = logSheet();
    else if(m.k === 'menu') html = menuSheet();
    else if(m.k === 'obs') html = obsChooseSheet();
  }
  modalEl.innerHTML = html ? `<div class="modal" data-act="backdrop"><div class="sheet${wide ? ' wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>` : '';
}

/* ---------- flow ---------- */
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({S, settings})); }catch(e){} }
function delay(passing){ const base = {slow:1700, normal:1000, fast:420}[settings.speed] || 1000; return passing ? base * 0.6 : base; }
function tick(){
  save(); render();
  clearTimeout(botTimer);
  if(!S || S.over || S.pending || ui.view !== 'game' || ui.queue.length) return;
  const p = S.players[S.cur];
  if(p.bot){
    const choice = bestAction(S.cur, p.bot);
    botTimer = setTimeout(() => { if(S.players[S.cur] !== p) return; S.flash = null; doAction(S.cur, choice.a); tick(); }, delay(choice.a.t === 'pass'));
  }
}
function humanAct(a){
  if(!isMyTurn()) return;
  undoSnap = JSON.stringify(S);
  ui.tipU = null; S.flash = null;
  doAction(0, a);
  ui.modal = null;
  tick();
}
function showTip(){
  const b = bestAction(0, 'hard'), p = S.players[0], a = b.a;
  let txt;
  if(a.t === 'pass') txt = 'Tip: passen lijkt nu verstandig. Bewaar je roebels voor betere kaarten.';
  else if(a.t === 'obs') txt = 'Tip: gebruik je Sterrenwacht en trek een kaart.';
  else if(a.t === 'take'){ const inst = rowArr(a.src)[a.i]; ui.tipU = inst.u; txt = `Tip: neem ${C(inst).name} in je hand, dan kun je hem later kopen.`; }
  else { const inst = (a.src === 'hand' ? p.hand : rowArr(a.src))[a.i]; ui.tipU = inst.u;
    const rep = a.rep ? p.cards.find(x => x.u === a.rep) : null;
    txt = `Tip: ${a.src === 'hand' ? 'speel' : 'koop'} ${C(inst).name} voor ${price(p, C(inst), a.src, rep)} ₽${rep ? ` en vervang je ${C(rep).name}` : ''}.`; }
  S.lastAct = txt;
  render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, d = el.dataset;
  if(act === 'backdrop'){ if(e.target !== el) return; if(ui.queue.length){ if(ui.queue[0].k === 'score') dismissQueue(); return; } if(!(S && S.pending && S.pending.pi === 0) && !(S && S.over && !ui.hideFinal)){ ui.modal = null; renderModal(); } return; }
  switch(act){
    case 'set': settings[d.k] = d.k === 'bots' ? +d.v : d.v; save(); render(); break;
    case 'new': if(S && !S.over){ ui.confirmNew = true; render(); } else startNew(); break;
    case 'new-yes': startNew(); break;
    case 'new-no': ui.confirmNew = false; render(); break;
    case 'resume': if(!S){ try{ S = JSON.parse(localStorage.getItem(SAVE_KEY)).S; }catch(e){} } if(S){ ui.view = 'game'; syncShown(); ui.hideFinal = false; tick(); } break;
    case 'again': startNew(); break;
    case 'home': ui.view = 'start'; ui.modal = null; ui.confirmNew = false; clearTimeout(botTimer); render(); break;
    case 'rules': ui.modal = {k:'rules'}; renderModal(); break;
    case 'cards': ui.modal = {k:'cards'}; renderModal(); break;
    case 'log': ui.modal = {k:'log'}; renderModal(); break;
    case 'menu': ui.modal = {k:'menu'}; renderModal(); break;
    case 'close': ui.modal = null; renderModal(); break;
    case 'card': ui.modal = {k:'card', src:d.src, i:+d.i}; renderModal(); break;
    case 'view': ui.modal = {k:'card', src:'view', id:d.id}; renderModal(); break;
    case 'rival': ui.modal = {k:'rival', pi:+d.pi}; renderModal(); break;
    case 'buy': humanAct({t:'buy', src:d.src, i:+d.i, rep:d.rep || null}); break;
    case 'take': humanAct({t:'take', src:d.src, i:+d.i}); break;
    case 'pass': humanAct({t:'pass'}); break;
    case 'tip': if(isMyTurn()) showTip(); break;
    case 'undo': if(undoSnap){ clearTimeout(botTimer); S = JSON.parse(undoSnap); undoSnap = null; S.lastAct = 'Je laatste zet is teruggenomen.'; ui.modal = null; syncShown(); tick(); } break;
    case 'obs-open': if(isMyTurn()){ ui.modal = {k:'obs'}; renderModal(); } break;
    case 'obs': if(isMyTurn()){ undoSnap = null; ui.modal = null; doAction(0, {t:'obs', deck:d.deck}); tick(); } break;
    case 'obs-buy': resolveObs({t:'buy', rep:d.rep || null}); tick(); break;
    case 'obs-hand': resolveObs({t:'hand'}); tick(); break;
    case 'obs-discard': resolveObs({t:'discard'}); tick(); break;
    case 'pub-inc': ui.pubK = Math.min(S.pending.max, (ui.pubK == null ? S.pending.max : ui.pubK) + 1); renderModal(); break;
    case 'pub-dec': ui.pubK = Math.max(0, (ui.pubK == null ? S.pending.max : ui.pubK) - 1); renderModal(); break;
    case 'pub-ok': case 'pub-zero': { const k = act === 'pub-zero' ? 0 : +d.k; S.pending = null; ui.pubK = null; undoSnap = null; applyPub(0, k); nextPub(); tick(); break; }
    case 'ov-ok': if(ui.queue[0] && ui.queue[0].k === 'draw'){ S.drawDone = true; ui.draw = null; } dismissQueue(); break;
    case 'draw-pick': drawPick(+d.pos, 0); break;
    case 'hide-final': ui.hideFinal = true; renderModal(); break;
    case 'show-final': ui.hideFinal = false; renderModal(); break;
  }
});
document.addEventListener('input', e => { if(e.target.id === 'f-name'){ settings.name = e.target.value; save(); } });
document.addEventListener('change', e => {
  if(e.target.id === 'f-big' || e.target.id === 'm-big'){ settings.big = e.target.checked; save(); render(); }
  if(e.target.id === 'f-sound' || e.target.id === 'm-sound'){ settings.sound = e.target.checked; save(); if(settings.sound){ audioUnlock(); playSound('turn'); } }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && ui.modal){ ui.modal = null; renderModal(); } });

function startNew(){
  clearTimeout(botTimer);
  settings.name = (document.getElementById('f-name') || {value:settings.name}).value || settings.name;
  newGame();
  ui = {view:'game', modal:null, tipU:null, confirmNew:false, shownBanner:0, shownScore:0, shownAnnounce:0, shownMove:S.moveId || 0, shownRotate:0, queue:[], draw:null, hideFinal:false};
  tick();
}

function boot(data){
  document.documentElement.lang = 'nl';
  try{
    const saved = data && data.S !== undefined ? data : JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if(saved){ if(saved.settings) settings = Object.assign(settings, saved.settings); if(saved.S && !saved.S.over) S = saved.S; }
  }catch(e){}
  if(S) syncShown();
  if(data && data.view === 'game' && S) ui.view = 'game';
  try{ if(sessionStorage.getItem('spb-resume') && S){ sessionStorage.removeItem('spb-resume'); ui.view = 'game'; } }catch(e){}
  render();
  if(ui.view === 'game') tick();
}
boot({});
</script>

<script>
// Offline: de service worker bewaart het spel op het apparaat
if('serviceWorker' in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // Bij terugkeren naar de app: kijken of er een nieuwe versie is
      document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
  });
  // Nieuwe versie actief: herladen en het spel gewoon laten doorgaan
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!hadController || reloading) return;
    reloading = true;
    try{ save(); if(ui.view === 'game') sessionStorage.setItem('spb-resume', '1'); }catch(e){}
    location.reload();
  });
}
</script>
</body>
</html>
