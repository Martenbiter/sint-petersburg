<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sint-Petersburg</title>
<meta name="theme-color" content="#123d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sint-Petersburg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: a real table top. Rivals sit along the top edge, the framed game board (score track, four draw piles, two card rows) is centre stage, your own table with banknotes, hand and city sits below, and one sticky action bar holds the turn. Single committed light "Winter Palace" look. */
:root{
  --facade:#dde8e1; --ivory:#fbf8f1; --ink:#1a2922; --ink-soft:#4b5c53; --line:#c9d6cd;
  --emerald:#123d2e; --emerald-2:#1d5743; --gold:#7d5f17; --gold-hi:#d9b55c; --gold-line:#c8a24b; --cream:#f7eed7;
  --board:#e4eeef; --board-2:#d3e2e4; --slot:#f3f8f8;
  --danger:#9a2d1f;
  --worker:#25522f; --building:#1e3a66; --aristocrat:#8b4416;
  --f-display:"Prata", Georgia, "Times New Roman", serif;
  --f-body:"PT Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px;
  color-scheme: light;
}
html,body{min-height:100%}
body{background:var(--facade);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;-webkit-tap-highlight-color:transparent}
html.groot body{font-size:19px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-soft)}

/* buttons */
.btn{border:1.5px solid var(--emerald);background:var(--ivory);color:var(--emerald);border-radius:999px;padding:.5em 1.1em;font-weight:700;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:.4em}
.btn:hover{background:#eef3ef}
.btn.primary{background:var(--emerald);color:var(--cream)}
.btn.primary:hover{background:var(--emerald-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:36px;padding:.3em .9em;font-size:.9em}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--ivory);border-radius:10px;padding:.5em 1em;min-height:44px;font-weight:700;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{border-color:var(--emerald);background:var(--emerald);color:var(--cream)}

/* card */
.card{all:unset;box-sizing:border-box;container-type:inline-size;position:relative;display:block;width:100%;max-width:100%;aspect-ratio:5/7;background:var(--c,var(--worker));border-radius:9px;color:var(--cream);cursor:pointer;box-shadow:0 1px 0 rgba(10,40,28,.25),0 3px 8px rgba(18,61,46,.2);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}
.card.t-worker{--c:var(--worker)} .card.t-building{--c:var(--building)} .card.t-aristocrat{--c:var(--aristocrat)}
.card .in{position:absolute;inset:4%;border:1px solid var(--gold-line);border-radius:6px;display:flex;flex-direction:column;align-items:center;padding:3% 4% 5%}
/* ruilkaarten: omgekeerd (licht perkament met gekleurde rand), zodat ze meteen opvallen */
.card.trade{background:#f6edd3;color:var(--c);--cut:#f6edd3;box-shadow:inset 0 0 0 4px var(--c),0 1px 0 rgba(10,40,28,.25),0 3px 8px rgba(18,61,46,.2)}
.card.trade .in{border:1.5px dashed var(--c)}
.card.trade .art{color:var(--c)}
.card.trade .art .g{fill:#b08a2c}
.card.trade .art .sg{stroke:#b08a2c}
.card.trade .yield{color:var(--c)}
.card.trade .yield .sq,.card.trade .yield .dsc{border-color:var(--c)}
.card.trade .nm{color:#1a2922}
.card.trade .ty{background:var(--c);color:var(--cream);border-radius:999px;padding:1px 6px}
.card.trade .cost{box-shadow:0 0 0 2px var(--c)}
.card.trade.mini::after{content:"⇄";position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font-size:clamp(9px,18cqw,14px);font-weight:700;color:var(--c)}
.card .cost{position:absolute;top:-3%;left:-3%;width:27cqw;height:27cqw;border-radius:50%;background:var(--gold-hi);color:var(--emerald);font-weight:700;display:grid;place-items:center;font-size:clamp(11px,15cqw,20px);box-shadow:0 0 0 2px var(--c,var(--worker))}
.card .cost.disc{background:#f6e39e;box-shadow:0 0 0 2px var(--c),0 0 0 4px var(--gold-hi)}
.card .cost.na{background:#b9b2a0}
.card .yield{position:absolute;top:2%;right:4%;font-size:clamp(10px,12.5cqw,16px);font-weight:700;text-align:right;line-height:1.15;color:var(--gold-hi)}
.card .yield .sq{display:inline-block;width:.55em;height:.8em;border:1px solid var(--cream);vertical-align:-.05em;margin-left:1px}
.card .yield .dsc{display:inline-block;padding:0 .25em;border-radius:3px;color:var(--cream);border:1px solid var(--cream)}
.card .art{width:100%;flex:1;min-height:0;margin-top:22cqw;color:var(--cream)}
.card .nm{font-family:var(--f-display);font-size:clamp(10px,12.5cqw,19px);text-align:center;line-height:1.1;overflow-wrap:anywhere;hyphens:auto;margin-top:2%}
.card .ty{font-size:clamp(8px,8.5cqw,12px);color:var(--gold-hi);text-transform:uppercase;letter-spacing:.08em;margin-top:2%}
.card.dim{filter:saturate(.45) brightness(.85)}
.card.tip{outline:4px solid var(--gold);outline-offset:3px;animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{outline-color:transparent}}
.card.mini .cost,.card.mini .nm,.card.mini .ty{display:none}
.card.mini .art{margin-top:30cqw}
.card.mini .yield{font-size:clamp(9px,15cqw,13px)}
.art .g{fill:var(--gold-hi)} .art .d{fill:var(--cut,var(--c,var(--worker)))} .art .s{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round} .art .sg{fill:none;stroke:var(--gold-hi);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round} .art .sd{fill:none;stroke:var(--cut,var(--c,var(--worker)));stroke-width:2;stroke-linecap:round}

/* banknotes */
.purse{display:flex;align-items:center;gap:14px}
.notes{position:relative;height:var(--nh);flex:none}
.bill{position:absolute;top:0;width:var(--nw);height:var(--nh);box-sizing:border-box;border-radius:3px;background:var(--bb);border:3px solid var(--bc);box-shadow:0 1px 3px rgba(20,40,30,.3);display:flex;align-items:center;justify-content:flex-start;padding-left:3px}
.bill::before{content:"";position:absolute;inset:2px;border:1px dotted var(--bc);border-radius:2px;opacity:.7}
.bill b{position:relative;width:calc(var(--nh) * .62);height:calc(var(--nh) * .62);border-radius:50%;background:#8f8473;color:#fff;font-size:calc(var(--nh) * .32);display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px #c9bfae}
.bill.v1{--bc:#7d7286;--bb:#ece8ee} .bill.v2{--bc:#4877b0;--bb:#e5eef8} .bill.v5{--bc:#4f8e3e;--bb:#e8f2e1} .bill.v10{--bc:#c79b1c;--bb:#faf2d6} .bill.v20{--bc:#b8463a;--bb:#f8e5e1}
.purse .total{font-family:var(--f-display);font-size:1.6em;color:var(--emerald);line-height:1}
.purse .total small{display:block;font-family:var(--f-body);font-size:.5em;color:var(--ink-soft)}
.minibill{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.minibill i{width:20px;height:12px;border-radius:2px;border:2px solid #b8463a;background:#f8e5e1;box-sizing:border-box;display:inline-block}

/* pawn */
.pawn{display:inline-block;flex:none;vertical-align:middle}

/* start */
.start{max-width:880px;margin:0 auto;padding-block:24px 40px;display:grid;gap:24px}
.skyline{width:100%;height:auto;color:var(--emerald);display:block}
.skyline .g{fill:var(--gold-hi)} .skyline .d{fill:var(--facade)} .skyline .sg{fill:none;stroke:var(--gold);stroke-width:2}
.start-hero{display:grid;gap:8px;text-align:center}
.start-hero h1{font-size:clamp(2.2rem,7vw,3.6rem);color:var(--emerald);letter-spacing:.02em}
.start-hero p{color:var(--ink-soft);margin:0;font-size:1.05em}
.start-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
@media (min-width:760px){.start-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
.fan{display:flex;justify-content:center;padding:12px 0 8px;min-height:200px}
.fan .card{width:118px;flex:none;margin:0 -14px;pointer-events:none}
.fan .card:nth-child(1){transform:rotate(-9deg) translateY(10px)} .fan .card:nth-child(3){transform:rotate(9deg) translateY(10px)}
.panel{background:var(--ivory);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.form{display:grid;gap:18px}
.form label,.form .lbl{display:block;font-weight:700;margin-bottom:6px}
.form input[type=text]{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;padding:.6em .8em;font:inherit;background:#fff;min-height:44px}
.hint{color:var(--ink-soft);font-size:.9em;margin:6px 0 0}
.check{display:flex;gap:10px;align-items:center;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--emerald)}
.start-actions{display:flex;flex-wrap:wrap;gap:10px}

/* game frame */
.game{max-width:1080px;margin:0 auto;display:grid;gap:14px;padding-block:12px 20px}
.top{display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-size:1.3em;color:var(--emerald)}
.rnd{color:var(--ink-soft);font-weight:700}
.rnd .last{color:var(--danger)}
.top .btn{margin-left:auto}

/* rivals */
.rivals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rival{all:unset;box-sizing:border-box;cursor:pointer;background:var(--ivory);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px}
.rival:focus-visible{outline:3px solid var(--gold-hi)}
.rival.turn{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-hi) inset}
.rival-h{display:flex;align-items:center;gap:8px}
.rival-h b{font-family:var(--f-display);font-weight:400;font-size:1.1em;color:var(--emerald)}
.rival-h small{color:var(--ink-soft);font-size:.78em}
.rival-s{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.9em;align-items:center}
.counts{display:flex;gap:4px}
.counts span{min-width:22px;height:20px;border-radius:4px;color:var(--cream);font-size:.78em;font-weight:700;display:grid;place-items:center;padding:0 4px;box-sizing:border-box}
.thinking{font-size:.8em;font-weight:700;color:var(--gold)}

/* board */
.board{background:var(--board);border:6px solid var(--emerald);border-radius:16px;box-shadow:inset 0 0 0 2px var(--gold-hi),0 6px 18px rgba(18,61,46,.18);padding:16px;display:grid;gap:14px;position:relative;overflow:hidden}
.board > *{position:relative}
.board > .wm{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;opacity:.1;pointer-events:none;color:var(--building)}
.board .wm .g,.board .wm .d{fill:currentColor} .board .wm .sg{stroke:currentColor;fill:none}
.track{padding:14px 4px 14px}
.track-bar{position:relative;height:16px;display:flex;border-radius:3px;box-shadow:0 0 0 1.5px var(--emerald)}
.track-bar > span{flex:1;background:var(--slot)} .track-bar > span:nth-child(even){background:var(--board-2)}
.track-bar em{position:absolute;top:19px;font-style:normal;font-size:.7em;color:var(--ink-soft);transform:translateX(-50%)}
.track-pawn{position:absolute;bottom:2px;transform:translateX(-50%);transition:left .6s ease;line-height:0}
.track-pawn sup{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:.65em;line-height:1;font-weight:700;color:var(--emerald);white-space:nowrap}
.decks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.deck{display:grid;justify-items:center;align-content:start;gap:4px;text-align:center;min-width:0;padding:8px 4px 10px;border-radius:12px;transition:opacity .3s,background .3s}
.deck.d-worker{--pc:var(--worker)} .deck.d-building{--pc:var(--building)} .deck.d-aristocrat{--pc:var(--aristocrat)} .deck.d-trade{--pc:#5a4a1c}
.decks.live .deck:not(.cur){opacity:.5}
.deck.cur{background:var(--pc);color:var(--cream);box-shadow:0 0 0 3px var(--gold-hi),0 6px 14px rgba(18,61,46,.25)}
.deck.cur .back{box-shadow:inset 0 0 0 3px var(--c),inset 0 0 0 4.5px var(--cream),0 0 0 2px var(--gold-hi)}
.deck.cur .starter{color:#eef3ef}
.back{width:min(72px,100%);aspect-ratio:5/4;border-radius:8px;background:var(--c);box-shadow:inset 0 0 0 3px var(--c),inset 0 0 0 4.5px var(--gold-hi),0 3px 0 -1px var(--c),0 5px 0 -1px rgba(0,0,0,.25);display:grid;place-items:center;color:var(--cream);position:relative}
.back svg{width:56%;height:auto}
.back.worker{--c:var(--worker)} .back.building{--c:var(--building)} .back.aristocrat{--c:var(--aristocrat)}
.back.trade{background:linear-gradient(90deg,var(--worker) 0 33%,var(--building) 0 66%,var(--aristocrat) 0);--c:var(--building)}
.back .cnt{position:absolute;bottom:-8px;right:-8px;background:var(--ivory);color:var(--emerald);border:1.5px solid var(--emerald);border-radius:999px;font-size:.72em;font-weight:700;padding:0 6px}
.deck b{font-size:.85em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.deck.cur b{color:var(--cream);font-size:1.05em;white-space:normal;overflow-wrap:anywhere;hyphens:auto}
@media (max-width:520px){.deck.cur b{font-size:.9em}}
.deck .starter{font-size:.75em;color:var(--ink-soft);display:flex;align-items:center;gap:4px;white-space:nowrap;max-width:100%;overflow:hidden}
.deck .now{font-size:.75em;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--emerald);background:var(--gold-hi);border-radius:999px;padding:2px 10px}
.phasepill{background:var(--pc);color:var(--cream);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.95em;white-space:nowrap;box-shadow:0 0 0 2px var(--gold-hi)}
.phasepill.worker{--pc:var(--worker)} .phasepill.building{--pc:var(--building)} .phasepill.aristocrat{--pc:var(--aristocrat)} .phasepill.trade{--pc:#5a4a1c}
.ab-msg .phasepill{font-size:.85em;flex:none}
.top{flex-wrap:wrap}
.rowlbl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-family:var(--f-display);color:var(--emerald)}
.rowlbl span{font-family:var(--f-body);font-size:.8em;color:var(--ink-soft)}
.rowlbl .plaque{font-family:var(--f-body);font-weight:700;font-size:.78em;background:var(--gold-hi);color:var(--emerald);border-radius:4px;padding:0 6px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (min-width:760px){.slots{grid-template-columns:repeat(8,minmax(0,1fr))}}
.slot{aspect-ratio:5/7;border-radius:9px;border:1.5px dashed #a9c0c2;background:rgba(255,255,255,.45)}
.bonus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.8em}
.bonus-wrap{overflow-x:auto;max-width:100%}
.bonus table{border-collapse:collapse;background:var(--ivory)}
.bonus td{border:1px solid #d5b48a;text-align:center;padding:1px 5px;font-variant-numeric:tabular-nums}
.bonus tr:first-child td{background:#f1c48f;color:#5a2a08;font-weight:700}
.bonus td.me{background:var(--emerald)!important;color:var(--cream);font-weight:700}
.bonus p{margin:0;color:var(--ink-soft);max-width:34ch}

/* my table */
.mytable{background:var(--ivory);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 18px;display:grid;gap:16px}
.mytable.turn{box-shadow:0 0 0 2px var(--emerald) inset}
.mt-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.mt-head h2{font-size:1.4em;color:var(--emerald)}
.vpbadge{background:var(--emerald);color:var(--cream);border-radius:999px;padding:2px 12px;font-weight:700}
.mt-top{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:760px){.mt-top{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}}
.zone{min-width:0}
.zone h3{font-size:1.05em;color:var(--emerald);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.zone h3 small{font-family:var(--f-body);font-size:.75em;color:var(--ink-soft)}
.handslots{display:grid;grid-template-columns:repeat(4,minmax(0,92px));gap:10px}
html.groot .handslots{grid-template-columns:repeat(4,minmax(0,110px))}
.tableau{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tgroup{border-top:3px solid var(--c);padding-top:8px;display:grid;gap:8px;align-content:start}
.tgroup.worker{--c:var(--worker)} .tgroup.building{--c:var(--building)} .tgroup.aristocrat{--c:var(--aristocrat)}
.tgroup h4{margin:0;font-size:.9em;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tgroup h4 span{color:var(--ink-soft);font-weight:400}
.minis{display:flex;flex-wrap:wrap;gap:8px}
.mini-wrap{position:relative;width:52px}
html.groot .mini-wrap{width:62px}
.mini-wrap i{position:absolute;bottom:-6px;right:-6px;font-style:normal;background:var(--gold-hi);color:var(--emerald);border-radius:999px;font-size:.72em;font-weight:700;padding:0 5px;border:1.5px solid var(--ivory)}
.mini-wrap.new .card{animation:glow 1.4s ease-out 1}
@keyframes glow{0%{box-shadow:0 0 0 6px var(--gold-hi)}100%{box-shadow:0 0 0 0 transparent}}
.none{color:var(--ink-soft);font-size:.88em}

/* action bar */
.actionbar{position:sticky;bottom:0;z-index:20;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));background:var(--emerald);color:var(--cream);border-top:3px solid var(--gold-hi);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ab-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.ab-msg{flex:1 1 260px;min-width:0;display:flex;gap:10px;align-items:center}
.ab-msg > div{display:grid;min-width:0}
.ab-msg b{font-size:1.05em}
.ab-msg span{font-size:.88em;color:#cfe0d6;overflow-wrap:anywhere}
.ab-btns{display:flex;gap:8px;flex-wrap:wrap}
.actionbar .btn{border-color:var(--gold-hi);background:transparent;color:var(--cream)}
.actionbar .btn.primary{background:var(--gold-hi);color:var(--emerald)}
.actionbar .btn:disabled{opacity:.35}

/* banner + toast */
.banner{position:fixed;left:0;right:0;top:38%;z-index:30;pointer-events:none;display:flex;justify-content:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.banner div{background:var(--emerald);color:var(--cream);border:2px solid var(--gold-hi);border-radius:14px;padding:14px 28px;text-align:center;box-shadow:0 10px 30px rgba(10,40,28,.35);animation:bann 1.9s ease forwards}
.banner small{display:block;color:var(--gold-hi);letter-spacing:.12em;text-transform:uppercase;font-size:.78em;font-weight:700}
.banner strong{font-family:var(--f-display);font-weight:400;font-size:1.7em}
@keyframes bann{0%{opacity:0;transform:scale(.92)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:35;background:#f6ecc9;color:#4a3608;border:1.5px solid var(--gold-line);border-radius:12px;padding:10px 16px;box-shadow:0 8px 20px rgba(10,40,28,.25);width:max-content;max-width:min(560px,calc(100vw - 32px));box-sizing:border-box;font-size:.95em;pointer-events:none;animation:toast 4.5s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}8%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.banner div,.card.tip,.mini-wrap.new .card,.toast{animation:none}.banner{display:none}.card,.track-pawn{transition:none}}

/* move toast, rival last move, last-round ribbon, score overview */
.movetoast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:35;display:flex;align-items:center;gap:12px;background:var(--ivory);border:2px solid var(--gold-hi);border-radius:14px;padding:8px 16px 8px 8px;box-shadow:0 10px 26px rgba(10,40,28,.3);width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;pointer-events:none;animation:mt var(--d,2s) ease forwards}
.movetoast .mini-wrap{width:62px;flex:none}
.movetoast.pass{padding:10px 18px;border-color:var(--line);background:#eef3ef}
.movetoast b{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:400;color:var(--emerald);font-size:1.25em}
.movetoast span{font-size:1.1em;font-weight:700}
@keyframes mt{0%{opacity:0;transform:translate(-50%,-10px)}10%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
.lastmove{font-size:.85em;font-weight:700;background:#f6ecc9;color:#4a3608;border:1px solid var(--gold-line);border-radius:8px;padding:3px 8px;justify-self:start;max-width:100%;overflow-wrap:anywhere}
.lastmove.pass{background:var(--facade);color:var(--ink-soft);border-color:var(--line);font-weight:400}
.lastribbon{background:var(--danger);color:#fff;border-radius:8px;padding:8px 12px;font-weight:700;text-align:center;box-shadow:inset 0 0 0 2px var(--gold-hi)}
.ovs{display:grid;gap:10px}
.ovs-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--facade)}
.ovs-row.me{background:#f6ecc9;box-shadow:inset 0 0 0 1.5px var(--gold-line)}
.ovs-row .who{font-family:var(--f-display);font-size:1.15em;color:var(--emerald)}
.ovs-row .gain{font-size:1.35em;font-weight:700;display:flex;gap:12px;align-items:center;white-space:nowrap}
.ovs-row .gain .zero{font-size:.75em;font-weight:400;color:var(--ink-soft)}
.ovs-row .after{grid-column:2 / 4;font-size:.85em;color:var(--ink-soft)}
.gainbill{display:inline-block;width:28px;height:16px;border-radius:2px;border:2.5px solid #b8463a;background:#f8e5e1;box-sizing:border-box;vertical-align:-2px;margin-right:4px}
.ov-last{text-align:center;display:grid;gap:12px;justify-items:center}
.sc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;perspective:800px}
.sc{display:grid;justify-items:center;gap:6px;min-width:0}
.sc-card{all:unset;box-sizing:border-box;width:100%;max-width:110px;aspect-ratio:5/7;border-radius:10px;display:grid;place-items:center;align-content:center;gap:8px;text-align:center;color:var(--cream)}
.sc-card svg{width:55%;height:auto}
.sc-card.down{background:var(--emerald);box-shadow:inset 0 0 0 4px var(--emerald),inset 0 0 0 6px var(--gold-hi),0 4px 10px rgba(18,61,46,.25);cursor:pointer;transition:transform .15s}
.sc-card.down:not(:disabled):hover{transform:translateY(-4px)}
.sc-card.down:not(:disabled){animation:wiggle 1.6s ease-in-out infinite}
.sc-card.down:disabled{cursor:default;opacity:.85}
.sc-card.down:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
.sc-card.up{box-shadow:inset 0 0 0 4px var(--c),inset 0 0 0 6px var(--gold-hi),0 4px 10px rgba(18,61,46,.25);background:var(--c)}
.sc-card.up.worker{--c:var(--worker)} .sc-card.up.building{--c:var(--building)} .sc-card.up.aristocrat{--c:var(--aristocrat)} .sc-card.up.trade{--c:#5a4a1c}
.sc-card.up b{font-family:var(--f-display);font-weight:400;font-size:clamp(11px,3vw,16px);overflow-wrap:anywhere;padding:0 4px}
.sc-card.flip{animation:flip .6s ease-out}
@keyframes flip{0%{transform:rotateY(90deg) scale(1.1)}100%{transform:none}}
@keyframes wiggle{0%,100%{transform:none}50%{transform:translateY(-3px)}}
.sc-who{display:flex;align-items:center;gap:4px;font-weight:700;font-size:.9em;min-height:1.4em;max-width:100%;overflow-wrap:anywhere}
.sc-msg{font-weight:700;display:flex;align-items:center;gap:6px;justify-content:center;margin:0}
.sc-sum{display:grid;gap:6px}
.sc-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-radius:10px;background:var(--facade)}
.sc-row.me{background:#f6ecc9;box-shadow:inset 0 0 0 1.5px var(--gold-line)}
.rot{display:grid;gap:8px}
.rot-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--facade);animation:rotin .5s ease-out both}
.rot-row .phasepill{font-size:.85em;justify-self:start}
.rot-old{color:var(--ink-soft);text-decoration:line-through;display:flex;align-items:center;gap:4px;min-width:0;font-size:.9em}
.rot-arrow{font-weight:700;color:var(--gold)}
.rot-new{font-weight:700;display:flex;align-items:center;gap:4px;min-width:0}
.rot-new.me{color:var(--danger)}
.rot-me{font-size:1.1em;margin:0}
@keyframes rotin{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sc-card.flip,.sc-card.down,.rot-row{animation:none}}
.ov-last .big{font-family:var(--f-display);font-size:2.2em;color:var(--danger);line-height:1.1}
.ov-last ul{text-align:left;margin:0;padding-left:1.2em;display:grid;gap:6px}
.autoclose{height:4px;border-radius:2px;background:var(--gold-hi);transform-origin:left;animation:shrink var(--d,6s) linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.movetoast,.autoclose{animation:none}}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(14,36,27,.55);display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.modal{align-items:center;padding-bottom:12px}}
.sheet{background:var(--ivory);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92%;overflow:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));box-sizing:border-box;display:grid;gap:14px;border-top:4px solid var(--gold-hi)}
@media (min-width:640px){.sheet{border-radius:18px}}
.sheet.wide{max-width:880px}
.sheet h2{font-size:1.5em;color:var(--emerald)}
.sheet-top{display:flex;gap:16px;align-items:flex-start}
.sheet-top > .card{width:132px;flex:none;cursor:default}
.sheet-top > .card:hover{transform:none}
@media (max-width:420px){.sheet-top > .card{width:104px}}
.sheet p{margin:0}
.calc{background:var(--facade);border-radius:10px;padding:8px 12px;font-size:.92em}
.reason{color:var(--danger);font-size:.9em;font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns.col{flex-direction:column;align-items:stretch}
.stepper{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stepper output{font-size:2em;font-family:var(--f-display);min-width:1.5em;text-align:center}
.tbl-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:.92em}
table.t th,table.t td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th{color:var(--ink-soft);font-weight:700;font-size:.85em}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.win td{background:#f3ead0;font-weight:700}
.rules{display:grid;gap:12px;max-width:65ch}
.rules h3{font-size:1.1em;color:var(--emerald)}
.rules ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.note{background:#f3ead0;border:1px solid var(--gold-line);border-radius:10px;padding:10px 12px;font-size:.92em}
.loglist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.92em}
.loglist li.phase{font-weight:700;color:var(--emerald);margin-top:6px}
.loglist li.score{color:var(--gold)}
.loglist li.warn{color:var(--danger);font-weight:700}
.loglist li.pass{color:var(--ink-soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;background:var(--c);box-shadow:0 0 0 1.5px var(--gold-hi)}
.dot.worker{--c:var(--worker)} .dot.building{--c:var(--building)} .dot.aristocrat{--c:var(--aristocrat)} .dot.trade{background:conic-gradient(var(--worker) 0 33%,var(--building) 0 66%,var(--aristocrat) 0)}

/* basis */
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}
button,.card,.chip,.rival{touch-action:manipulation}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="app"></div>
<div id="banner"></div>
<div id="toast"></div>
<div id="modal"></div>

<script>
'use strict';
/* ================================================================
   KAARTEN — eerste editie (2004), volgens het kaartoverzicht.
   r = roebels, vp = punten, n = aantal in de doos,
   per = 1 ₽ per kaart van dat type, disc = 1 ₽ korting op dat type.
   ================================================================ */
const CAT = {};
function def(id, o){ CAT[id] = Object.assign({id, r:0, vp:0, trade:false, sp:null, per:null, disc:null, desc:''}, o); }
// Arbeiders (groene stapel)
def('houthakker',   {name:'Houthakker',    type:'worker', deck:'worker', cost:3, r:3, n:6, sub:'hout',   art:'axe'});
def('goudzoeker',   {name:'Goudzoeker',    type:'worker', deck:'worker', cost:4, r:3, n:6, sub:'goud',   art:'pick'});
def('herder',       {name:'Herder',        type:'worker', deck:'worker', cost:5, r:3, n:6, sub:'schaap', art:'sheep'});
def('pelsjager',    {name:'Pelsjager',     type:'worker', deck:'worker', cost:6, r:3, n:6, sub:'pels',   art:'ushanka'});
def('scheepsbouwer',{name:'Scheepsbouwer', type:'worker', deck:'worker', cost:7, r:3, n:6, sub:'schip',  art:'ship'});
def('tsaarpeter',   {name:'Tsaar Peter',   type:'worker', deck:'worker', cost:8, r:3, n:1, sub:'*',      art:'crown', desc:'Telt als elke soort arbeider: iedere groene ruilkaart mag hem vervangen.'});
// Gebouwen (blauwe stapel)
def('kroeg',        {name:'Kroeg',         type:'building', deck:'building', cost:1,  n:2, sp:'pub', art:'b_kroeg', desc:'Bij elke telling van de gebouwen mag je tot 5 keer 2 ₽ betalen voor 1 punt.'});
def('pakhuis',      {name:'Pakhuis',       type:'building', deck:'building', cost:2,  n:1, sp:'warehouse', art:'b_pakhuis', desc:'Je mag 1 kaart extra in je hand houden (4 in plaats van 3).'});
def('potjomkin',    {name:'Potjomkindorp', type:'building', deck:'building', cost:2,  n:1, sp:'potemkin', art:'b_potjomkin', desc:'Telt als 6 ₽ wanneer je hem vervangt door een blauwe ruilkaart.'});
def('sterrenwacht', {name:'Sterrenwacht',  type:'building', deck:'building', cost:6,  vp:1, n:2, sp:'obs', art:'b_sterren', desc:'Eén keer per gebouwenfase: trek als je beurt de bovenste kaart van een stapel naar keuze. Koop hem, neem hem in je hand of leg hem weg.'});
def('markt',        {name:'Markt',         type:'building', deck:'building', cost:5,  vp:1, n:5, art:'b_markt'});
def('douanehuis',   {name:'Douanehuis',    type:'building', deck:'building', cost:8,  vp:2, n:5, art:'b_douane'});
def('brandweer',    {name:'Brandweer',     type:'building', deck:'building', cost:11, vp:3, n:4, art:'b_brand'});
def('ziekenhuis',   {name:'Ziekenhuis',    type:'building', deck:'building', cost:14, vp:4, n:3, art:'b_zieken'});
def('bibliotheek',  {name:'Bibliotheek',   type:'building', deck:'building', cost:17, vp:5, n:2, art:'b_biblio'});
def('theater',      {name:'Theater',       type:'building', deck:'building', cost:20, vp:6, n:2, art:'b_theater'});
def('academie',     {name:'Academie',      type:'building', deck:'building', cost:23, vp:7, n:1, art:'b_academie'});
// Aristocraten (oranje stapel)
def('schrijver',    {name:'Schrijver',     type:'aristocrat', deck:'aristocrat', cost:4,  r:1,       n:5, art:'p_schrijver'});
def('bestuurder',   {name:'Bestuurder',    type:'aristocrat', deck:'aristocrat', cost:7,  r:2,       n:5, art:'p_bestuurder'});
def('rentmeester',  {name:'Rentmeester',   type:'aristocrat', deck:'aristocrat', cost:10, r:3,       n:5, art:'p_rentmeester'});
def('secretaris',   {name:'Secretaris',    type:'aristocrat', deck:'aristocrat', cost:12, r:4,       n:4, art:'p_secretaris'});
def('controleur',   {name:'Controleur',    type:'aristocrat', deck:'aristocrat', cost:14, r:4, vp:1, n:3, art:'p_controleur'});
def('rechter',      {name:'Rechter',       type:'aristocrat', deck:'aristocrat', cost:16, r:5, vp:2, n:3, art:'p_rechter'});
def('hofdame',      {name:'Hofdame',       type:'aristocrat', deck:'aristocrat', cost:18, r:6, vp:3, n:2, art:'p_hofdame'});
// Ruilkaarten: arbeiders
def('werkplaats',   {name:'Timmerwerkplaats', type:'worker', deck:'trade', trade:true, cost:4,  r:3,       n:2, sub:'hout',   disc:'building',   art:'saw', desc:'Je betaalt 1 ₽ minder voor elk gebouw (blauwe kaart).'});
def('smelterij',    {name:'Goudsmelterij', type:'worker', deck:'trade', trade:true, cost:6,  r:3,       n:2, sub:'goud',   disc:'aristocrat', art:'furnace', desc:'Je betaalt 1 ₽ minder voor elke aristocraat (oranje kaart).'});
def('weverij',      {name:'Weverij',       type:'worker', deck:'trade', trade:true, cost:8,  r:6,       n:2, sub:'schaap', art:'spool'});
def('bontwinkel',   {name:'Bontwinkel',    type:'worker', deck:'trade', trade:true, cost:10, r:3, vp:2, n:2, sub:'pels',   art:'coat'});
def('werf',         {name:'Scheepswerf',   type:'worker', deck:'trade', trade:true, cost:12, r:6, vp:1, n:2, sub:'schip',  art:'slipway'});
// Ruilkaarten: gebouwen
def('mariinski',    {name:'Mariinski-theater', type:'building', deck:'trade', trade:true, cost:10, per:'aristocrat', n:1, art:'b_mariinski', desc:'Levert 1 ₽ op voor elke aristocraat die je hebt.'});
def('bank',         {name:'Bank',          type:'building', deck:'trade', trade:true, cost:13, r:5, vp:1, n:1, art:'b_bank'});
def('peterhof',     {name:'Peterhof',      type:'building', deck:'trade', trade:true, cost:14, r:4, vp:2, n:1, art:'b_peterhof'});
def('isaak',        {name:'Isaäkkathedraal', type:'building', deck:'trade', trade:true, cost:15, r:3, vp:3, n:1, art:'b_isaak'});
def('haven',        {name:'Haven',         type:'building', deck:'trade', trade:true, cost:16, r:5, vp:2, n:1, art:'b_haven'});
def('opstanding',   {name:'Opstandingskerk', type:'building', deck:'trade', trade:true, cost:16, r:2, vp:4, n:1, art:'b_opstanding'});
def('catharina',    {name:'Catharinapaleis', type:'building', deck:'trade', trade:true, cost:17, r:1, vp:5, n:1, art:'b_catharina'});
def('smolny',       {name:'Smolny-kathedraal', type:'building', deck:'trade', trade:true, cost:17, r:4, vp:3, n:1, art:'b_smolny'});
def('hermitage',    {name:'Hermitage',     type:'building', deck:'trade', trade:true, cost:18, r:3, vp:4, n:1, art:'b_hermitage'});
def('winterpaleis', {name:'Winterpaleis',  type:'building', deck:'trade', trade:true, cost:19, r:2, vp:5, n:1, art:'b_winter'});
// Ruilkaarten: aristocraten
def('priester',     {name:'Priester',      type:'aristocrat', deck:'trade', trade:true, cost:6,  r:1, vp:1, n:1, art:'p_priester'});
def('wapenmeester', {name:'Wapenmeester',  type:'aristocrat', deck:'trade', trade:true, cost:8,  r:4,       n:1, art:'p_wapenmeester'});
def('kamenierster', {name:'Kamenierster',  type:'aristocrat', deck:'trade', trade:true, cost:8,  vp:2,      n:1, art:'p_kamenierster'});
def('bouwmeester',  {name:'Bouwmeester',   type:'aristocrat', deck:'trade', trade:true, cost:10, r:5,       n:1, art:'p_bouwmeester'});
def('senator',      {name:'Senator',       type:'aristocrat', deck:'trade', trade:true, cost:12, r:2, vp:2, n:1, art:'p_senator'});
def('patriarch',    {name:'Patriarch',     type:'aristocrat', deck:'trade', trade:true, cost:16, vp:4,      n:1, art:'p_patriarch'});
def('tollenaar',    {name:'Belastinginner', type:'aristocrat', deck:'trade', trade:true, cost:17, per:'worker', n:1, art:'p_tollenaar', desc:'Levert 1 ₽ op voor elke arbeider die je hebt.'});
def('admiraal',     {name:'Admiraal',      type:'aristocrat', deck:'trade', trade:true, cost:18, r:3, vp:3, n:1, art:'p_admiraal'});
def('minister',     {name:'Minister',      type:'aristocrat', deck:'trade', trade:true, cost:20, r:2, vp:4, n:1, art:'p_minister'});
def('tsaar',        {name:'Tsaar',         type:'aristocrat', deck:'trade', trade:true, cost:24, vp:6,      n:1, art:'p_tsaar'});

const PH = [
  {key:'worker',     name:'Arbeiders',    deck:'worker'},
  {key:'building',   name:'Gebouwen',     deck:'building'},
  {key:'aristocrat', name:'Aristocraten', deck:'aristocrat'},
  {key:'trade',      name:'Ruilkaarten',  deck:'trade'}];
const TYPE_PH = {worker:0, building:1, aristocrat:2};
const TYPE_NL = {worker:'Arbeider', building:'Gebouw', aristocrat:'Aristocraat'};
const TYPE_PL = {worker:'arbeider', building:'gebouw', aristocrat:'aristocraat'};
const DECK_NL = {worker:'Arbeiders', building:'Gebouwen', aristocrat:'Aristocraten', trade:'Ruilkaarten'};
const LEVEL_NL = {easy:'Makkelijk', medium:'Gemiddeld', hard:'Moeilijk'};
const ROW = 8, START_MONEY = 25, HAND = 3, HAND_PENALTY = 5;
const ARI = [0,1,3,6,10,15,21,28,36,45,55];
const BOT_NAMES = ['Anna','Boris','Katja'];
const PAWN = ['#b3261e','#5b3a9b','#2e2e2e','#f3efe3'];
const SAVE_KEY = 'spb-nl-2';
const APP_VERSION = 8; // ophogen bij elke nieuwe versie

/* ================================================================
   SPELREGELS (engine)
   ================================================================ */
let S = null;
let settings = {name:'Jij', bots:2, level:'medium', speed:'normal', big:false, sound:true};
let undoSnap = null;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const C = inst => CAT[inst.id];
function note(pi, short, id){ S.players[pi].lastMove = short; S.move = {pi, txt:S.lastAct, id:id || null, short}; S.moveId = (S.moveId || 0) + 1; }
function addLog(txt, cls){ S.log.push({txt, cls:cls||''}); if(S.log.length>120) S.log.shift(); }

function newGame(){
  const n = settings.bots + 1;
  const decks = {worker:[], building:[], aristocrat:[], trade:[]};
  let uid = 0;
  // startkaarten trekken: om de beurt (vanaf een willekeurige speler) tot alle 4 fasen verdeeld zijn
  const first = Math.floor(Math.random() * n);
  const drawSeq = shuffle([0,1,2,3]).map((phase, k) => ({pi:(first + k) % n, phase}));
  const markers = [0,0,0,0]; drawSeq.forEach(d => markers[d.phase] = d.pi);
  for(const c of Object.values(CAT)) for(let k=0;k<c.n;k++) decks[c.deck].push({u:'k'+(uid++), id:c.id});
  for(const d in decks) shuffle(decks[d]);
  S = {players:[], decks, deckSize:{}, upper:[], lower:[], round:1, phase:0,
       markers, drawSeq, drawDone:false, prevMarkers:null, rotateId:0, cur:0, passes:0, lastRound:false,
       log:[], pending:null, over:false, lastAct:'', lastScore:null, scoreId:0, flash:null, bannerId:0, final:null};
  for(const d in decks) S.deckSize[d] = decks[d].length;
  const mk = (name, bot) => ({name, bot, money:START_MONEY, vp:0, cards:[], hand:[], obsUsed:false});
  S.players.push(mk((settings.name||'').trim() || 'Jij', null));
  for(let i=0;i<settings.bots;i++) S.players.push(mk(BOT_NAMES[i], settings.level));
  undoSnap = null;
  addLog(`Nieuw spel met ${n} spelers. Iedereen begint met ${START_MONEY} ₽.`);
  startPhase();
}

function startPhase(){
  const ph = PH[S.phase], deck = S.decks[ph.deck];
  const need = Math.max(0, ROW - S.upper.length - S.lower.length);
  const k = Math.min(need, deck.length);
  for(let i=0;i<k;i++) S.upper.push(deck.shift());
  if(need > 0 && deck.length === 0 && !S.lastRound){
    S.lastRound = true;
    S.announceDeck = ph.name; S.announceId = (S.announceId || 0) + 1;
    addLog(`De stapel ${ph.name} is op. Dit is de laatste ronde!`, 'warn');
  }
  if(S.phase === 1) S.players.forEach(p => p.obsUsed = false);
  S.players.forEach(p => p.lastMove = null);
  S.cur = S.markers[S.phase]; S.passes = 0;
  undoSnap = null;
  S.bannerId++;
  addLog(`Ronde ${S.round} · ${ph.name}. ${S.players[S.cur].name} begint.`, 'phase');
}

const handLimit = p => HAND + p.cards.filter(x => C(x).sp === 'warehouse').length;
const owned = (p, id) => p.cards.filter(x => x.id === id).length;
const countType = (p, type) => p.cards.filter(x => C(x).type === type).length;
const discFor = (p, type) => p.cards.filter(x => C(x).disc === type).length;
const replValue = c => c.sp === 'potemkin' ? 6 : c.cost;
const rowArr = src => src === 'upper' ? S.upper : src === 'lower' ? S.lower : null;
const incomeOf = (p, c) => c.per ? countType(p, c.per) : c.r;
function replOptions(p, c){
  if(!c.trade) return null;
  return p.cards.filter(x => {
    const o = C(x); if(o.type !== c.type || o.trade) return false; // alleen gewone kaarten vervangen
    if(c.type === 'worker') return o.sub === c.sub || o.sub === '*';
    return true;
  });
}
function priceParts(p, c, src, rep){
  const parts = [];
  if(src === 'lower') parts.push([1, 'onderste rij']);
  const o = owned(p, c.id); if(o) parts.push([o, `je hebt er al ${o}`]);
  const d = discFor(p, c.type); if(d) parts.push([d, d > 1 ? `${d} kortingskaarten` : (c.type === 'building' ? 'Timmerwerkplaats' : 'Goudsmelterij')]);
  if(rep) parts.push([replValue(C(rep)), `${C(rep).name} ingeleverd`]);
  return parts;
}
function price(p, c, src, rep){
  return Math.max(1, c.cost - priceParts(p, c, src, rep).reduce((s, x) => s + x[0], 0));
}
function buyOptions(p, inst, src){
  const c = C(inst);
  if(c.trade) return replOptions(p, c).map(r => ({rep:r.u, price:price(p, c, src, r)}));
  return [{rep:null, price:price(p, c, src, null)}];
}
const canObs = p => S.phase === 1 && !p.obsUsed && p.cards.some(x => C(x).sp === 'obs');
function legalActions(pi){
  const p = S.players[pi], acts = [];
  for(const src of ['upper','lower']) rowArr(src).forEach((inst, i) => {
    for(const o of buyOptions(p, inst, src)) if(o.price <= p.money) acts.push({t:'buy', src, i, rep:o.rep});
    if(p.hand.length < handLimit(p)) acts.push({t:'take', src, i});
  });
  p.hand.forEach((inst, i) => {
    for(const o of buyOptions(p, inst, 'hand')) if(o.price <= p.money) acts.push({t:'buy', src:'hand', i, rep:o.rep});
  });
  if(canObs(p)) for(const d of Object.keys(S.decks)) if(S.decks[d].length > 1) acts.push({t:'obs', deck:d});
  acts.push({t:'pass'});
  return acts;
}

function placeCard(p, inst, repU, cost){
  let rep = null;
  if(repU){ const ri = p.cards.findIndex(x => x.u === repU); rep = p.cards.splice(ri, 1)[0]; }
  p.money -= cost; p.cards.push(inst);
  S.flash = {u:inst.u};
  return rep;
}

function doAction(pi, a){
  const p = S.players[pi];
  if(a.t === 'pass'){
    S.passes++; S.lastAct = `${p.name} past.`; addLog(S.lastAct, 'pass'); note(pi, 'past');
    return advance();
  }
  S.passes = 0;
  if(a.t === 'buy'){
    const arr = a.src === 'hand' ? p.hand : rowArr(a.src);
    const inst = arr[a.i], c = C(inst);
    const repInst = a.rep ? p.cards.find(x => x.u === a.rep) : null;
    const cost = price(p, c, a.src, repInst);
    if(cost > p.money) return;
    arr.splice(a.i, 1);
    const rep = placeCard(p, inst, a.rep, cost);
    S.lastAct = `${p.name} ${a.src === 'hand' ? 'speelt' : 'koopt'} ${c.name}${a.src === 'hand' ? ' uit de hand' : ''} voor ${cost} ₽${rep ? ` (vervangt ${C(rep).name})` : ''}.`;
    addLog(S.lastAct); note(pi, `${a.src === 'hand' ? 'speelde' : 'kocht'} ${c.name} · ${cost} ₽`, inst.id);
  } else if(a.t === 'take'){
    const inst = rowArr(a.src).splice(a.i, 1)[0];
    p.hand.push(inst);
    S.lastAct = `${p.name} neemt ${C(inst).name} in de hand.`; addLog(S.lastAct); note(pi, `nam ${C(inst).name} in de hand`, inst.id);
  } else if(a.t === 'obs'){
    const inst = S.decks[a.deck].shift();
    p.obsUsed = true;
    S.pending = {t:'obs', pi, inst};
    addLog(`${p.name} gebruikt de Sterrenwacht en trekt ${C(inst).name}.`);
    if(p.bot) return resolveObs(botObs(pi, inst));
    return;
  }
  advance();
}

function resolveObs(choice){
  const {pi, inst} = S.pending, p = S.players[pi], c = C(inst);
  S.pending = null;
  if(choice.t === 'buy'){
    const repInst = choice.rep ? p.cards.find(x => x.u === choice.rep) : null;
    const cost = price(p, c, 'hand', repInst);
    const rep = placeCard(p, inst, choice.rep, cost);
    S.lastAct = `${p.name} koopt ${c.name} via de Sterrenwacht voor ${cost} ₽${rep ? ` (vervangt ${C(rep).name})` : ''}.`;
  } else if(choice.t === 'hand'){
    p.hand.push(inst); S.lastAct = `${p.name} neemt ${c.name} via de Sterrenwacht in de hand.`;
  } else {
    S.lastAct = `${p.name} legt ${c.name} weg.`;
  }
  addLog(S.lastAct); note(pi, choice.t === 'buy' ? `kocht ${c.name} (Sterrenwacht)` : choice.t === 'hand' ? `nam ${c.name} in de hand` : `Sterrenwacht: ${c.name} weggelegd`, inst.id);
  advance();
}

function advance(){
  const n = S.players.length;
  if(S.passes >= n) return endPhase();
  S.cur = (S.cur + 1) % n;
}

function phaseGain(p, type){
  let r = 0, v = 0;
  p.cards.forEach(x => { const c = C(x); if(c.type === type){ r += incomeOf(p, c); v += c.vp; } });
  return {r, v};
}
function endPhase(){
  const ph = S.phase;
  if(ph < 3){
    const type = PH[ph].key, parts = [];
    S.players.forEach((p, i) => { const g = phaseGain(p, type); p.money += g.r; p.vp += g.v; parts.push({i, name:p.name, r:g.r, v:g.v}); });
    S.lastScore = {phase:ph, parts, round:S.round}; S.scoreId++;
    addLog(`Telling ${PH[ph].name}: ` + parts.map(x => `${x.name} ${fmtGain(x.r, x.v)}`).join(', ') + '.', 'score');
  }
  if(ph === 1){
    S.pubQueue = S.players.map((p, i) => i).filter(i => pubMax(S.players[i]) > 0);
    return nextPub();
  }
  finishPhase();
}
function fmtGain(r, v){ const a = []; if(r) a.push(`+${r} ₽`); if(v) a.push(`+${v} ★`); return a.length ? a.join(' ') : 'niets'; }
const pubMax = p => Math.min(5 * p.cards.filter(x => C(x).sp === 'pub').length, Math.floor(p.money / 2));
function nextPub(){
  while(S.pubQueue && S.pubQueue.length){
    const pi = S.pubQueue.shift(), p = S.players[pi], max = pubMax(p);
    if(max <= 0) continue;
    if(p.bot){ applyPub(pi, botPub(pi, max)); continue; }
    S.pending = {t:'pub', pi, max};
    return;
  }
  finishPhase();
}
function applyPub(pi, k){
  const p = S.players[pi];
  if(k > 0){ p.money -= 2 * k; p.vp += k; addLog(`${p.name} koopt in de Kroeg ${k} punt${k > 1 ? 'en' : ''} voor ${2 * k} ₽.`, 'score'); if(S.lastScore) S.lastScore.pub = (S.lastScore.pub || []).concat([{name:p.name, k}]); }
}
function finishPhase(){
  if(S.phase < 3){ S.phase++; return startPhase(); }
  if(S.lastRound) return endGame();
  if(S.lower.length) addLog(`${S.lower.length} kaart${S.lower.length > 1 ? 'en' : ''} uit de onderste rij gaan weg; de bovenste rij schuift naar beneden.`);
  S.lower = S.upper; S.upper = [];
  S.prevMarkers = S.markers.slice();
  S.markers = S.markers.map(m => (m + 1) % S.players.length);
  S.rotateId = (S.rotateId || 0) + 1;
  S.round++; S.phase = 0;
  startPhase();
}
function aristoKinds(cards){ return new Set(cards.filter(x => C(x).type === 'aristocrat').map(x => x.id)).size; }
function endGame(){
  S.over = true;
  S.final = S.players.map((p, i) => {
    const kinds = aristoKinds(p.cards), bonus = ARI[Math.min(10, kinds)];
    const geld = Math.floor(p.money / 10), hand = -HAND_PENALTY * p.hand.length;
    return {i, name:p.name, vp:p.vp, kinds, bonus, geld, hand, money:p.money, total:p.vp + bonus + geld + hand};
  }).sort((a, b) => b.total - a.total || b.money - a.money);
  addLog(`Einde van het spel. ${S.final[0].name} wint met ${S.final[0].total} punten!`, 'phase');
}

/* ================================================================
   BOTS
   ================================================================ */
// waarde van 1 roebel in punten, met k rondes te gaan; per niveau instelbaar
// afgesteld met toernooien tussen bots: vroeg in het spel is geld veel waard (investeren), aan het eind bijna niets
const WPAR = {easy:{base:0.1, slope:0.07, cap:0.55}, medium:{base:0.1, slope:0.3, cap:2.5}, hard:{base:0.1, slope:0.4, cap:3}};
let WP = WPAR.medium;
const W = k => (k === 1 && WP.w1 != null) ? WP.w1 : Math.min(WP.cap, WP.base + WP.slope * Math.max(0, k));
const isHard = lvl => lvl !== 'easy' && lvl !== 'medium';
function estRounds(){
  if(S.lastRound) return 1;
  let m = 99;
  PH.forEach((ph, pi) => {
    const d = ph.deck;
    const drawn = S.deckSize[d] - S.decks[d].length - (pi === 0 ? ROW : 0);
    const done = S.round - 1 + (S.phase >= pi ? 1 : 0) - (pi === 0 ? 1 : 0);
    const per = Math.max(2.5, (4.5 * 2 + Math.max(0, drawn)) / (2 + Math.max(0, done)));
    m = Math.min(m, S.decks[d].length / per);
  });
  return Math.max(1, Math.min(10, 1 + Math.floor(m)));
}
function incomeVal(p, c, R){
  const first = TYPE_PH[c.type] >= S.phase ? 0 : 1;
  const r = c.per ? countType(p, c.per) + 0.5 : c.r;
  let v = 0;
  for(let i = first; i < R; i++) v += c.vp + r * W(R - 1 - i);
  return v;
}
function value(p, inst, src, repU, R){
  const c = C(inst), rep = repU ? p.cards.find(x => x.u === repU) : null;
  const cost = price(p, c, src, rep);
  let g = incomeVal(p, c, R);
  if(rep) g -= incomeVal(p, C(rep), R);
  if(c.type === 'aristocrat'){
    const before = aristoKinds(p.cards), after = aristoKinds(p.cards.filter(x => x !== rep).concat([inst]));
    g += ARI[Math.min(10, after)] - ARI[Math.min(10, before)];
  }
  if(c.disc){ for(let k = 0; k < R - 1; k++) g += 1.1 * W(R - 2 - k); }
  // kaarten die op het aantal arbeiders/aristocraten letten maken die soort waardevoller
  p.cards.forEach(x => { const o = C(x); if(o.per && o.per === c.type && !rep) g += W(R - 1) * Math.max(0, R - 1) * 0.8; });
  const bLeft = S.phase <= 1 ? R : R - 1;
  if(c.sp === 'pub') g += bLeft * (R <= 3 ? 1.6 : 0.7);
  if(c.sp === 'obs') g += 0.6 * Math.max(0, bLeft - 1);
  if(c.sp === 'warehouse') g += p.hand.length >= handLimit(p) ? 1.2 : 0.4;
  if(c.sp === 'potemkin') g += R > 2 ? 1.5 : 0;
  return {v: g - cost * W(R - 1), cost};
}
function bestAction(pi, lvl){
  WP = WPAR[lvl] || WPAR.hard;
  const p = S.players[pi], R = estRounds();
  const noise = {easy:3, medium:0.9}[lvl] || 0;
  let best = {a:{t:'pass'}, s: isHard(lvl) ? 0.2 : 0.4};
  const acts = legalActions(pi);
  if(lvl === 'easy' && Math.random() < 0.3){
    const buys = acts.filter(a => a.t === 'buy');
    if(buys.length) return {a:buys[Math.floor(Math.random() * buys.length)], s:1};
  }
  const income = p.cards.reduce((s, x) => s + incomeOf(p, C(x)), 0);
  for(const a of acts){
    let s;
    if(a.t === 'buy'){
      const inst = (a.src === 'hand' ? p.hand : rowArr(a.src))[a.i];
      s = value(p, inst, a.src, a.rep, R).v;
      if(a.src === 'hand') s += R <= 1 ? HAND_PENALTY : 1;
    } else if(a.t === 'take'){
      if(lvl === 'easy' || R <= 1) continue;
      const inst = rowArr(a.src)[a.i];
      if(buyOptions(p, inst, a.src).some(o => o.price <= p.money)) continue;
      const opts = buyOptions(p, inst, 'hand'); if(!opts.length) continue;
      const short = Math.min(...opts.map(o => o.price)) - p.money;
      if(short > income + 4) continue;
      const v = Math.max(...opts.map(o => value(p, inst, 'hand', o.rep, R).v));
      if(v < (isHard(lvl) ? 2.5 : 3.5)) continue;
      s = v * (isHard(lvl) ? 0.5 : 0.35) - (R <= 2 ? 2 : 0.5);
    } else if(a.t === 'obs'){
      if(lvl === 'easy' || p.money < 6) continue;
      s = R >= 2 ? (a.deck === (R <= 3 ? 'building' : 'worker') ? 1.1 : 0.8) : 0.3;
    } else continue;
    s += (Math.random() * 2 - 1) * noise;
    if(s > best.s) best = {a, s};
  }
  return best;
}
function botObs(pi, inst){
  WP = WPAR[S.players[pi].bot] || WPAR.hard;
  const p = S.players[pi], R = estRounds();
  let best = {t:'discard', s:0};
  for(const o of buyOptions(p, inst, 'hand')){
    if(o.price > p.money) continue;
    const s = value(p, inst, 'hand', o.rep, R).v;
    if(s > best.s) best = {t:'buy', rep:o.rep, s};
  }
  if(best.t === 'discard' && p.hand.length < handLimit(p) && R > 2){
    const opts = buyOptions(p, inst, 'hand');
    if(opts.length && Math.max(...opts.map(o => value(p, inst, 'hand', o.rep, R).v)) > 3) best = {t:'hand'};
  }
  return best;
}
function botPub(pi, max){
  const p = S.players[pi], lvl = p.bot, after = estRounds() - 1;
  WP = WPAR[lvl] || WPAR.hard;
  if(lvl === 'easy') return Math.floor(Math.random() * (max + 1));
  if(lvl === 'medium') return after === 0 ? max : (p.money >= 16 ? Math.min(max, 2) : 0);
  if(after === 0) return max;
  if(W(after) >= 0.5) return 0;
  const reserve = 6 + 3 * Math.min(after, 3);
  return Math.max(0, Math.min(max, Math.floor((p.money - reserve) / 2)));
}

let actx = null, amaster = null, anoise = null;
function audioUnlock(){
  try{
    if(!actx){
      actx = new (window.AudioContext || window.webkitAudioContext)();
      amaster = actx.createGain(); amaster.gain.value = 0.6; amaster.connect(actx.destination);
      anoise = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
      const d = anoise.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if(actx.state === 'suspended') actx.resume();
  }catch(e){ actx = null; }
}
function aEnv(g, t, a, peak, dur){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function aTone(f, t, dur, o){
  o = o || {}; const osc = actx.createOscillator(), g = actx.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t); if(o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide, t + dur);
  aEnv(g, t, o.a || 0.005, (o.vol || 0.3) * aLevel, dur); osc.connect(g).connect(amaster); osc.start(t); osc.stop(t + dur + 0.05);
}
function aNoise(t, dur, o){
  o = o || {}; const s = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = anoise; s.playbackRate.value = 0.8 + Math.random() * 0.4;
  fl.type = o.type || 'bandpass'; fl.frequency.setValueAtTime(o.f || 2000, t); if(o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t + dur); fl.Q.value = o.q || 1;
  aEnv(g, t, o.a || 0.004, (o.vol || 0.3) * aLevel, dur); s.connect(fl).connect(g).connect(amaster); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
function aBell(f, t, dur, vol){ [[1,1],[2,0.6],[2.4,0.4],[3,0.3],[4.2,0.25],[5.4,0.15],[0.5,0.5]].forEach(([r, v], i) => aTone(f * r, t, dur * (i === 6 ? 1.2 : 1 / (1 + i * 0.35)), {vol: vol * v, a: 0.004})); }
function aCoin(t, vol, base){ const f = base + Math.random() * 1400; aTone(f, t, 0.18, {vol}); aTone(f * 1.48, t, 0.12, {vol: vol * 0.6}); aNoise(t, 0.02, {type:'highpass', f:5000, vol: vol * 0.8}); }
let aLevel = 1;
const SOUNDS = {
  turn(t){ aTone(659, t, 0.35, {vol:0.3}); aTone(1318, t, 0.15, {vol:0.06}); aTone(880, t + 0.16, 0.45, {vol:0.3}); aTone(1760, t + 0.16, 0.18, {vol:0.06}); },
  buy(t){ aNoise(t, 0.16, {f:1200, f2:3800, q:0.8, vol:0.35, a:0.03}); aNoise(t + 0.15, 0.06, {type:'lowpass', f:900, vol:0.6}); },
  pass(t){ [0, 0.13].forEach(d => { aTone(190, t + d, 0.12, {vol:0.4, glide:120}); aNoise(t + d, 0.04, {type:'lowpass', f:700, vol:0.5}); }); },
  money(t){ for(let i = 0; i < 12; i++) aCoin(t + i * 0.035 + Math.random() * 0.05, 0.08, 1800); aNoise(t, 0.25, {type:'lowpass', f:600, vol:0.15, a:0.02}); },
  points(t){ aTone(1046, t, 0.9, {vol:0.18}); aTone(1568, t, 0.7, {vol:0.08}); aTone(2093, t, 0.4, {vol:0.04}); },
  phase(t){ for(let i = 0; i < 14; i++) aNoise(t + i * 0.045, 0.035, {f:2500 + Math.random() * 1500, q:1.2, vol:0.25}); },
  last(t){ aBell(98, t, 4, 0.35); },
  win(t){ [[523,0,0.18],[659,0.18,0.18],[784,0.36,0.18],[1046,0.54,0.7]].forEach(([f, d, l]) => { aTone(f, t + d, l, {type:'sawtooth', vol:0.07, a:0.02}); aTone(f, t + d, l, {vol:0.1, a:0.02}); }); }
};
function playSound(name, delayMs, level){
  if(!settings.sound || !actx || !SOUNDS[name]) return;
  try{
    if(actx.state === 'suspended') actx.resume();
    aLevel = level || 1;
    SOUNDS[name](actx.currentTime + 0.03 + (delayMs || 0) / 1000);
    aLevel = 1;
  }catch(e){}
}
if(typeof document !== 'undefined'){
  document.addEventListener('pointerdown', audioUnlock, true);
  document.addEventListener('keydown', audioUnlock, true);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && actx && actx.state === 'suspended') actx.resume().catch(() => {}); });
}

const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function pawnSVG(i, size){
  size = size || 16; const col = PAWN[i % PAWN.length];
  return `<svg class="pawn" width="${size}" height="${Math.round(size * 1.25)}" viewBox="0 0 16 20" aria-hidden="true"><circle cx="8" cy="5" r="4" fill="${col}" stroke="#1a2922" stroke-width="1"/><path d="M3 19 Q3 11 8 10 Q13 11 13 19Z" fill="${col}" stroke="#1a2922" stroke-width="1"/></svg>`;
}
function yieldTxt(c){
  const a = [];
  if(c.per) a.push(`1₽/<span class="sq" style="background:var(--${c.per})"></span>`);
  else if(c.r) a.push(`+${c.r} ₽`);
  if(c.vp) a.push(`+${c.vp} ★`);
  if(c.disc) a.push(`<span class="dsc" style="background:var(--${c.disc})">−1</span>`);
  return a.join('<br>');
}
function cardHTML(inst, o){
  o = o || {};
  const c = C(inst);
  let costTxt = c.cost, cls = '';
  if(o.price != null){ costTxt = o.price; if(o.price < c.cost) cls = 'disc'; }
  if(o.na) cls = 'na';
  const attrs = o.act ? `data-act="${o.act}" data-src="${o.src || ''}" data-i="${o.i == null ? '' : o.i}" data-id="${c.id}"` : 'tabindex="-1"';
  const lbl = `${c.name}, ${c.trade ? 'ruilkaart ' : ''}${TYPE_PL[c.type]}${o.mini ? '' : `, kost ${costTxt} roebel`}`;
  return `<button class="card t-${c.type}${c.trade ? ' trade' : ''}${o.mini ? ' mini' : ''}${o.dim ? ' dim' : ''}${ui.tipU === inst.u ? ' tip' : ''}" ${attrs} aria-label="${esc(lbl)}">
    <span class="in"><span class="cost ${cls} num">${costTxt}</span><span class="yield">${yieldTxt(c)}</span>
    <svg class="art" viewBox="0 0 100 64" aria-hidden="true">${ART[c.art] || ''}</svg>
    <span class="nm" lang="nl">${esc(c.name)}</span><span class="ty">${c.trade ? 'Ruilkaart' : TYPE_NL[c.type]}</span></span></button>`;
}
function notesFor(amount){
  const out = []; let left = amount;
  for(const v of [20,10,5,2,1]){ while(left >= v){ out.push(v); left -= v; } }
  return out;
}
function moneyHTML(amount, big){
  const nw = big ? 64 : 50, nh = big ? 36 : 28, step = big ? 27 : 21;
  let notes = notesFor(amount);
  const extra = notes.length > 7 ? notes.length - 7 : 0;
  if(extra) notes = notes.slice(0, 7);
  const w = notes.length ? nw + (notes.length - 1) * step : nw;
  const bills = notes.length ? notes.map((v, i) => `<span class="bill v${v}" style="left:${i * step}px;transform:rotate(${((i % 3) - 1) * 3}deg)"><b>${v}</b></span>`).join('')
    : `<span class="bill v1" style="left:0;opacity:.3"><b>0</b></span>`;
  return `<div class="purse" aria-label="${amount} roebel"><div class="notes" style="--nw:${nw}px;--nh:${nh}px;width:${w}px">${bills}</div><div class="total num">${amount} ₽<small>${extra ? `+ nog ${extra} biljetten` : 'roebels'}</small></div></div>`;
}
function shownPrice(inst, src){
  const p = S.players[0], opts = buyOptions(p, inst, src);
  if(!opts.length) return {price:C(inst).cost, na:true, ok:false};
  const pr = Math.min(...opts.map(o => o.price));
  return {price:pr, na:false, ok:pr <= p.money};
}
